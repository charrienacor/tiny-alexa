<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tiny alexa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff3d9e'/%3E%3C/svg%3E" />
  <style>
    /* ============================================================
     tiny alexa — black / pink / white, minimalist
     Single self-contained file. No external assets, no CDN.
     ============================================================ */
    :root {
      --bg: #050506;
      --bg-soft: #0b0b0e;
      --white: #f6f6f8;
      --muted: #8b8b93;

      --pink-100: #ffe1ef;
      --pink-200: #ffc2e0;
      --pink-300: #ff9ecb;
      --pink-400: #ff6fb5;
      --pink-500: #ff3d9e;
      /* primary hot pink */
      --pink-600: #f0128a;
      --pink-700: #c4006e;
      /* the same theme as rgb triplets, for rgba(var(--accent-rgb), a);
         COLOR commands retint all of these (see THEMES in the script) */
      --accent-rgb: 255, 61, 158;
      /* = --pink-500 */
      --accent-hi-rgb: 255, 158, 203;
      /* = --pink-300 */
      --accent-lo-rgb: 255, 225, 239;
      /* = --pink-100 */
      --sweep-rgb: 255, 61, 158;
      --glow: rgba(var(--accent-rgb), .55);
      /* light / dark mode (LIGHT_ON / LIGHT_OFF): the script blends these
         together with --bg, --white and --muted between the MODES below */
      --surface-rgb: 9, 9, 11;
      /* card / panel fill */
      --line-rgb: 255, 255, 255;
      /* hairlines + tracks drawn on top of surfaces */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
    }

    /* faint radial vignette so pure black feels less flat */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(120% 90% at 50% 38%, rgba(var(--accent-rgb), .06), transparent 60%);
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vh, 40px);
      padding: 24px;
      text-align: center;
    }

    /* ---------- wordmark ---------- */
    .wordmark {
      font-weight: 200;
      letter-spacing: .42em;
      font-size: clamp(26px, 6vw, 44px);
      line-height: 1;
      padding-left: .42em;
      /* balance trailing letter-space */
      transition: opacity .5s ease, transform .5s ease, font-size .5s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .wordmark .tiny {
      color: var(--white);
    }

    .wordmark .alexa {
      color: var(--pink-500);
      font-weight: 300;
    }

    .wordmark .dot {
      display: inline-block;
      width: .28em;
      height: .28em;
      border-radius: 50%;
      background: var(--pink-500);
      margin-left: .18em;
      vertical-align: baseline;
      box-shadow: 0 0 14px var(--glow);
      transition: box-shadow .4s ease, background .4s ease;
    }

    /* when a response is showing, wordmark recedes */
    body.busy .wordmark {
      opacity: .28;
      transform: translateY(-6px) scale(.92);
    }

    body.busy .wordmark .dot {
      box-shadow: 0 0 22px var(--glow);
    }

    /* ---------- status / response text ---------- */
    .status {
      min-height: clamp(54px, 9vh, 84px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .phrase {
      font-weight: 300;
      font-size: clamp(30px, 7.5vw, 58px);
      letter-spacing: .02em;
      line-height: 1.05;
      opacity: 0;
      transform: translateY(10px) scale(.98);
      filter: blur(6px);
      transition: opacity .42s cubic-bezier(.2, .7, .2, 1),
        transform .42s cubic-bezier(.2, .7, .2, 1),
        filter .42s ease;
      will-change: opacity, transform, filter;
    }

    .phrase.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .phrase.wake {
      color: var(--pink-400);
      text-shadow: 0 0 30px var(--glow);
    }

    .phrase.confirm {
      color: var(--white);
    }

    /* the lamp, call, alarm and aircon scenes fill the middle of the stage
       and carry their own captions ("SETTING TO 60%", "RINGING — 6:00 AM"),
       so the phrase / detail line would only peek out from behind them */
    body.ac-active .status,
    body.lamp-active .status,
    body.call-active .status,
    body.alarm-active .status {
      opacity: 0;
    }

    /* lift the confirm line above the timer ring while one is running */
    .status {
      transition: margin-bottom .45s ease;
    }

    body.timer-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }

    .detail {
      font-weight: 400;
      font-size: clamp(14px, 3.4vw, 18px);
      letter-spacing: .04em;
      color: var(--pink-200);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .4s ease .08s, transform .4s ease .08s;
    }

    .detail.show {
      opacity: .92;
      transform: translateY(0);
    }

    .detail .tag {
      color: var(--muted);
      font-size: .82em;
      letter-spacing: .08em;
      margin-left: .5em;
    }

    /* ---------- waveform ---------- */
    .wave-wrap {
      width: min(88vw, 560px);
      height: clamp(120px, 22vh, 180px);
      position: relative;
    }

    canvas#wave {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- timer ring ---------- */
    .timer {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vh, 18px);
      pointer-events: none;
      opacity: 0;
      transform: scale(.9);
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1), transform .5s cubic-bezier(.2, .7, .2, 1);
    }

    .timer.show {
      opacity: 1;
      transform: scale(1);
    }

    .timer.done {
      pointer-events: auto;
    }

    .ring-wrap {
      position: relative;
      width: clamp(190px, 36vh, 280px);
      aspect-ratio: 1;
    }

    .ring-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      transform: rotate(-90deg);
    }

    .ring-track {
      stroke: rgba(var(--accent-rgb), .13);
    }

    .ring-fill {
      stroke: url(#tg);
      filter: drop-shadow(0 0 10px var(--glow));
      transition: stroke-dashoffset .12s linear;
    }

    .ring-core {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .ring-time {
      font-weight: 200;
      font-size: clamp(42px, 9vh, 64px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }

    .ring-sub {
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .timer.stop {
      pointer-events: auto;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(var(--accent-rgb), .35);
      background: rgba(var(--accent-rgb), .07);
      color: var(--pink-200);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: background .25s ease, border-color .25s ease, transform .15s ease;
    }

    .timer.stop:hover {
      background: rgba(var(--accent-rgb), .15);
      border-color: var(--pink-400);
    }

    .timer.stop:active {
      transform: scale(.96);
    }

    .timer.done .ring-fill {
      filter: drop-shadow(0 0 26px var(--glow));
    }

    .timer.done .ring-time {
      animation: pop .7s cubic-bezier(.2, .7, .2, 1);
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.14);
      }

      100% {
        transform: scale(1);
      }
    }

    /* final 3s: the number pulses */
    .timer.urgent .ring-time {
      animation: urgent .9s ease-in-out infinite;
      color: var(--pink-300);
    }

    @keyframes urgent {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.06);
        opacity: .82;
      }
    }

    /* while a timer runs, the ring is the hero — fade the rest back */
    body.timer-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.timer-active .wordmark {
      opacity: .12;
    }

    /* ---------- aircon (TEMPERATURE intent) ---------- */
    .ac {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vh, 24px);
      pointer-events: none;
      opacity: 0;
      transform: scale(.92) translateY(10px);
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1), transform .5s cubic-bezier(.2, .7, .2, 1);
    }

    .ac.show {
      opacity: 1;
      transform: none;
    }

    /* the unit */
    .ac-unit {
      position: relative;
      width: clamp(250px, 46vw, 380px);
      aspect-ratio: 2.2/1;
      border-radius: 18px;
      background: linear-gradient(180deg, #16161b 0%, #0c0c10 100%);
      border: 1px solid rgba(var(--accent-rgb), .4);
      box-shadow: 0 0 44px rgba(var(--accent-rgb), .14), inset 0 1px 0 rgba(255, 255, 255, .07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 26px);
      perspective: 300px;
    }

    .ac.show .ac-unit {
      animation: acOn .7s cubic-bezier(.2, .7, .2, 1);
    }

    @keyframes acOn {
      0% {
        box-shadow: 0 0 0 rgba(var(--accent-rgb), 0);
      }

      45% {
        box-shadow: 0 0 70px rgba(var(--accent-rgb), .45);
        border-color: var(--pink-300);
      }

      100% {
        box-shadow: 0 0 44px rgba(var(--accent-rgb), .14);
        border-color: rgba(var(--accent-rgb), .4);
      }
    }

    /* fan — spins faster the colder the target */
    .ac-fan {
      width: clamp(44px, 8vh, 58px);
      height: auto;
      flex: none;
      animation: spin var(--fanDur, 1s) linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* LED display */
    .ac-screen {
      display: flex;
      align-items: baseline;
      gap: 2px;
      font-weight: 200;
      font-size: clamp(34px, 8vh, 52px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      color: rgb(var(--accent-hi-rgb));
      /* on a dark device face: keep the bright shade in light mode too */
      text-shadow: 0 0 20px var(--glow);
    }

    .ac-screen .ac-deg {
      font-size: .45em;
      color: rgb(var(--accent-hi-rgb));
      /* on the dark unit: stays bright in light mode */
    }

    .ac-screen .ac-mode {
      font-size: .28em;
      letter-spacing: .3em;
      color: var(--muted);
      margin-left: 10px;
      text-transform: uppercase;
    }

    /* status LED */
    .ac-led {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink-500);
      box-shadow: 0 0 8px var(--glow);
      opacity: .35;
    }

    .ac.cooling .ac-led {
      opacity: 1;
      animation: ledPulse 1.4s ease-in-out infinite;
    }

    @keyframes ledPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    /* louver flap at the bottom vent */
    .ac-louver {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      height: 7px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--pink-700), var(--pink-500) 50%, var(--pink-700));
      transform-origin: center bottom;
      transform: rotateX(70deg);
      transition: transform .8s ease;
    }

    .ac.cooling .ac-louver {
      animation: louverFlap 1.5s ease-in-out infinite;
    }

    @keyframes louverFlap {

      0%,
      100% {
        transform: rotateX(62deg);
      }

      50% {
        transform: rotateX(18deg);
      }
    }

    /* cold-air streaks falling from the vent */
    .ac-air {
      position: relative;
      width: clamp(210px, 40vw, 330px);
      height: clamp(110px, 24vh, 200px);
      overflow: hidden;
    }

    .air {
      position: absolute;
      top: -34px;
      border-radius: 3px;
      opacity: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(var(--accent-hi-rgb), .35) 55%, transparent);
      filter: blur(.4px);
      animation: airFall linear forwards;
    }

    @keyframes airFall {
      0% {
        transform: translate(0, -10px) scaleY(.5);
        opacity: 0;
      }

      14% {
        opacity: var(--airO, .7);
      }

      100% {
        transform: translate(var(--sway, 10px), 210px) scaleY(1.3);
        opacity: 0;
      }
    }

    /* mist glow under the unit */
    .ac-mist {
      position: absolute;
      left: 50%;
      top: calc(100% - 6px);
      transform: translateX(-50%);
      width: 130%;
      height: 70px;
      pointer-events: none;
      background: radial-gradient(ellipse at center top, rgba(var(--accent-hi-rgb), .3), transparent 70%);
      opacity: 0;
      transition: opacity .9s ease;
    }

    .ac.cooling .ac-mist {
      opacity: 1;
      animation: mistPulse 2.6s ease-in-out infinite;
    }

    @keyframes mistPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .55;
      }
    }

    .ac-sub {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--pink-300);
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .5s ease .15s, transform .5s ease .15s;
    }

    .ac.show .ac-sub {
      opacity: .9;
      transform: none;
    }

    /* while the AC is the hero, fade the rest back (same as the timer) */
    body.ac-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.ac-active .wordmark {
      opacity: .12;
    }

    body.ac-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }

    /* ---------- lamp — pendant light for BRIGHTNESS ---------- */
    .lamp {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
      --lum: 0;
      opacity: 0;
      transform: scale(.96);
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1), transform .5s cubic-bezier(.2, .7, .2, 1);
    }

    .lamp.show {
      opacity: 1;
      transform: none;
    }

    /* big soft halo centered on the bulb — scales & fades with --lum */
    .lamp-glow {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: calc(13vh + clamp(60px, 13vw, 85px) + 40px);
      width: clamp(300px, 72vmin, 620px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(calc(.55 + .75*var(--lum, 0)));
      background: radial-gradient(circle, rgba(var(--accent-lo-rgb), .5) 0%, rgba(var(--accent-hi-rgb), .28) 30%, rgba(var(--accent-rgb), .12) 52%, transparent 70%);
      opacity: var(--lum, 0);
    }

    /* dust motes drifting in the beam */
    .lamp-rays {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: calc(13vh + clamp(60px, 13vw, 85px) + 40px);
      width: clamp(240px, 50vw, 420px);
      height: clamp(200px, 40vh, 340px);
      transform: translateX(-50%);
    }

    .ray {
      position: absolute;
      top: 4px;
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, var(--pink-100), rgba(var(--accent-hi-rgb), .4) 70%);
      animation: rayDrift linear forwards;
    }

    @keyframes rayDrift {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }

      12% {
        opacity: var(--ro, .6);
      }

      100% {
        transform: translate(var(--sx, 20px), 230px);
        opacity: 0;
      }
    }

    /* cord + shade, swaying gently from the ceiling mount */
    .lamp-hang {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: lampSway 4.5s ease-in-out infinite alternate;
    }

    @keyframes lampSway {
      from {
        transform: rotate(-1.3deg);
      }

      to {
        transform: rotate(1.3deg);
      }
    }

    .lamp-hang::before {
      /* ceiling mount */
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 8px;
      border-radius: 4px;
      background: #1a1a20;
      border: 1px solid rgba(var(--accent-rgb), .3);
    }

    .lamp-cord {
      width: 2px;
      height: 13vh;
      background: linear-gradient(180deg, rgba(var(--accent-rgb), .5), rgba(var(--accent-rgb), .16));
    }

    .lamp-shade {
      position: relative;
      width: clamp(120px, 26vw, 170px);
      aspect-ratio: 2/1;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      background: linear-gradient(180deg, #191920 0%, #0d0d11 100%);
      border: 1px solid rgba(var(--accent-rgb), .4);
      border-bottom: 2px solid var(--pink-500);
      box-shadow: 0 0 30px rgba(var(--accent-rgb), .12), inset 0 6px 14px rgba(255, 255, 255, .05);
    }

    .lamp-bulb {
      position: absolute;
      left: 50%;
      bottom: -15px;
      transform: translateX(-50%);
      width: 36%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, #2b2b33, #101014 72%);
      border: 1px solid rgba(var(--accent-rgb), .3);
    }

    .lamp-bulb::after {
      /* lit core — opacity tracks --lum */
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--pink-100) 45%, var(--pink-400) 90%);
      opacity: var(--lum, 0);
      box-shadow: 0 0 24px 6px var(--glow);
    }

    .lamp.igniting .lamp-glow,
    .lamp.igniting .lamp-bulb::after {
      animation: ignite .95s steps(1, end);
    }

    @keyframes ignite {
      0% {
        opacity: 0;
      }

      10% {
        opacity: .85;
      }

      18% {
        opacity: .15;
      }

      30% {
        opacity: 1;
      }

      40% {
        opacity: .35;
      }

      55% {
        opacity: .95;
      }

      68% {
        opacity: .5;
      }

      82% {
        opacity: 1;
      }
    }

    /* light pooling on the floor */
    .lamp-floor {
      position: absolute;
      z-index: 1;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 16vh;
      background: radial-gradient(ellipse at center, rgba(var(--accent-hi-rgb), .4), transparent 68%);
      opacity: calc(var(--lum, 0)*.75);
    }

    .lamp-readout {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 2px;
      font-weight: 200;
      font-size: clamp(38px, 9vh, 58px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      color: var(--pink-200);
      text-shadow: 0 0 22px var(--glow);
      margin-top: clamp(12px, 2.6vh, 22px);
    }

    .lamp-readout .lamp-sign {
      font-size: .5em;
      color: var(--pink-400);
    }

    .lamp-readout .lamp-mode {
      font-size: .3em;
      letter-spacing: .3em;
      color: var(--muted);
      margin-left: 12px;
      text-transform: uppercase;
    }

    .lamp-sub {
      position: relative;
      z-index: 2;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--pink-300);
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .5s ease .15s, transform .5s ease .15s;
    }

    .lamp.show .lamp-sub {
      opacity: .9;
      transform: none;
    }

    /* while the lamp is the hero, fade the rest back (same as the timer / AC) */
    body.lamp-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.lamp-active .wordmark {
      opacity: .12;
    }

    body.lamp-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }

    /* ---------- phone (CALL intent) ---------- */
    .call {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.6vh, 14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1);
    }

    .call.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* breathing halo behind the avatar */
    .call-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(72vw, 420px);
      aspect-ratio: 1;
      transform: translate(-50%, -58%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), .16), transparent 65%);
      animation: glowPulse 2.8s ease-in-out infinite;
    }

    @keyframes glowPulse {

      0%,
      100% {
        transform: translate(-50%, -58%) scale(1);
        opacity: .7;
      }

      50% {
        transform: translate(-50%, -58%) scale(1.12);
        opacity: 1;
      }
    }

    /* avatar with expanding sonar rings while dialing */
    .call-avatar {
      position: relative;
      width: clamp(120px, 24vh, 170px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: avatarIn .6s cubic-bezier(.2, .9, .3, 1.35);
    }

    @keyframes avatarIn {
      0% {
        transform: scale(.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .call-avatar::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #23232b, #101014 75%);
      border: 1px solid rgba(var(--accent-rgb), .55);
      box-shadow: 0 0 40px rgba(var(--accent-rgb), .28), inset 0 0 24px rgba(var(--accent-rgb), .12);
    }

    .call-icon {
      position: relative;
      width: 42%;
      fill: var(--pink-300);
      filter: drop-shadow(0 0 12px var(--glow));
    }

    .ring {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 2px solid var(--pink-400);
      opacity: 0;
      animation: sonar 1.8s cubic-bezier(.2, .6, .4, 1) infinite;
    }

    .ring.r2 {
      animation-delay: .6s;
    }

    .ring.r3 {
      animation-delay: 1.2s;
    }

    .call.connected .ring {
      display: none;
    }

    @keyframes sonar {
      0% {
        transform: scale(1);
        opacity: .8;
      }

      100% {
        transform: scale(2.1);
        opacity: 0;
      }
    }

    .call-name {
      font-weight: 200;
      font-size: clamp(26px, 5.4vh, 40px);
      letter-spacing: .04em;
      color: var(--white);
      text-shadow: 0 0 24px var(--glow);
      animation: nameIn .55s ease .1s backwards;
    }

    @keyframes nameIn {
      0% {
        transform: translateY(10px);
        opacity: 0;
      }

      100% {
        transform: none;
        opacity: 1;
      }
    }

    .call-status {
      font-size: 12px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--pink-300);
      font-weight: 500;
      animation: blinkSoft 1.6s ease-in-out infinite;
    }

    .call.connected .call-status {
      animation: none;
      opacity: .85;
    }

    @keyframes blinkSoft {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .45;
      }
    }

    .call-timer {
      font-weight: 200;
      font-size: clamp(18px, 3.6vh, 26px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .12em;
      color: var(--muted);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .4s ease, transform .4s ease;
    }

    .call.connected .call-timer {
      opacity: .9;
      transform: none;
    }

    /* equalizer bars — dance while connected */
    .call-eq {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 22px;
      margin-top: 2px;
    }

    .call-eq i {
      width: 4px;
      border-radius: 2px;
      height: 30%;
      background: linear-gradient(180deg, var(--pink-300), var(--pink-600));
      box-shadow: 0 0 8px var(--glow);
      animation: eq 1s ease-in-out infinite;
      animation-play-state: paused;
    }

    .call-eq i:nth-child(1) {
      animation-duration: .9s;
      animation-delay: -.2s;
    }

    .call-eq i:nth-child(2) {
      animation-duration: 1.15s;
      animation-delay: -.6s;
    }

    .call-eq i:nth-child(3) {
      animation-duration: .8s;
      animation-delay: -.35s;
    }

    .call-eq i:nth-child(4) {
      animation-duration: 1.3s;
      animation-delay: -.8s;
    }

    .call-eq i:nth-child(5) {
      animation-duration: .95s;
      animation-delay: -.1s;
    }

    .call-eq i:nth-child(6) {
      animation-duration: 1.1s;
      animation-delay: -.5s;
    }

    .call-eq i:nth-child(7) {
      animation-duration: .85s;
      animation-delay: -.7s;
    }

    .call.connected .call-eq i {
      animation-play-state: running;
    }

    @keyframes eq {

      0%,
      100% {
        height: 22%;
      }

      50% {
        height: 100%;
      }
    }

    /* hang-up button */
    .call-btns {
      margin-top: clamp(14px, 3.4vh, 30px);
    }

    .call-btn {
      width: clamp(64px, 12vh, 84px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), .55);
      cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #2a1520, #150a10 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(var(--accent-rgb), .3), inset 0 0 18px rgba(var(--accent-rgb), .15);
      transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s ease;
      animation: btnIn .5s ease .25s backwards;
    }

    @keyframes btnIn {
      0% {
        transform: scale(.4);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .call-btn svg {
      width: 52%;
      fill: var(--pink-300);
      filter: drop-shadow(0 0 8px var(--glow));
    }

    .call-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 44px rgba(var(--accent-rgb), .5), inset 0 0 22px rgba(var(--accent-rgb), .25);
    }

    .call-btn:active {
      transform: scale(.94);
    }

    /* hang-up state — flash, then the whole screen fades */
    .call.bye {
      animation: byeFlash .55s ease;
    }

    @keyframes byeFlash {
      0% {
        opacity: 1;
      }

      35% {
        opacity: .25;
      }

      100% {
        opacity: 1;
      }
    }

    /* while the phone is the hero, fade the rest back (same as the timer) */
    body.call-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.call-active .wordmark {
      opacity: .12;
    }

    body.call-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }

    /* ---------- alarm (ALARM intent) — twin-bell clock ----------
     set (quiet, shows the time) -> ringing (shake, hammer, waves, tone)
     -> off / snoozed (settle, fade). Same scene contract as the call. */
    .alarm {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(.92);
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1), transform .5s cubic-bezier(.2, .7, .2, 1);
    }

    .alarm.show {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .alarm-glow {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(340px, 80vmin, 640px);
      aspect-ratio: 1;
      background: radial-gradient(circle, rgba(var(--accent-hi-rgb), .22), rgba(var(--accent-rgb), .1) 45%, transparent 68%);
      opacity: 0;
      transition: opacity .6s ease;
    }

    .alarm.ringing .alarm-glow {
      opacity: 1;
      animation: alarmGlowPulse .9s ease-in-out infinite alternate;
    }

    @keyframes alarmGlowPulse {
      from {
        scale: 1;
      }

      to {
        scale: 1.07;
      }
    }

    /* the whole clock shakes while ringing */
    .alarm-clock {
      position: relative;
      z-index: 2;
      width: clamp(170px, 38vh, 230px);
      aspect-ratio: 1;
    }

    .alarm.ringing .alarm-clock {
      animation: alarmShake .16s linear infinite alternate;
    }

    @keyframes alarmShake {
      from {
        transform: rotate(-6deg);
      }

      to {
        transform: rotate(6deg);
      }
    }

    /* after stop: the shaking settles out like a real clock */
    .alarm.off .alarm-clock {
      animation: alarmSettle .8s ease;
    }

    @keyframes alarmSettle {
      0% {
        transform: rotate(-5deg);
      }

      30% {
        transform: rotate(4deg);
      }

      55% {
        transform: rotate(-2.5deg);
      }

      75% {
        transform: rotate(1.2deg);
      }

      100% {
        transform: none;
      }
    }

    /* snoozed: the clock dozes, bobbing gently */
    .alarm.snoozed .alarm-clock {
      animation: alarmDoze 2.4s ease-in-out infinite alternate;
    }

    @keyframes alarmDoze {
      from {
        transform: translateY(0) rotate(-1deg);
      }

      to {
        transform: translateY(5px) rotate(1deg);
      }
    }

    /* bells */
    .alarm-bell {
      position: absolute;
      top: -9%;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50% 50% 8% 8%;
      background: linear-gradient(160deg, #23232b, #101015 70%);
      border: 1px solid rgba(var(--accent-rgb), .5);
      box-shadow: 0 0 18px rgba(var(--accent-rgb), .18), inset 0 4px 8px rgba(255, 255, 255, .06);
      transform-origin: 50% 92%;
    }

    .alarm-bell.left {
      left: -4%;
      transform: rotate(-26deg);
    }

    .alarm-bell.right {
      right: -4%;
      transform: rotate(26deg);
    }

    .alarm-bell.left::after,
    .alarm-bell.right::after {
      /* dome shine */
      content: "";
      position: absolute;
      left: 22%;
      top: 16%;
      width: 34%;
      height: 30%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(var(--accent-lo-rgb), .5), transparent 70%);
    }

    .alarm.ringing .alarm-bell.left {
      animation: alarmBellL .16s linear infinite alternate;
    }

    .alarm.ringing .alarm-bell.right {
      animation: alarmBellR .16s linear infinite alternate;
    }

    @keyframes alarmBellL {
      from {
        transform: rotate(-26deg);
      }

      to {
        transform: rotate(-40deg);
      }
    }

    @keyframes alarmBellR {
      from {
        transform: rotate(26deg);
      }

      to {
        transform: rotate(40deg);
      }
    }

    /* hammer between the bells */
    .alarm-hammer {
      position: absolute;
      top: -14%;
      left: 50%;
      transform: translateX(-50%);
      width: 6%;
      height: 16%;
      background: linear-gradient(180deg, var(--pink-300), var(--pink-500));
      border-radius: 3px;
      transform-origin: 50% 100%;
    }

    .alarm-hammer::before {
      /* pivot cap */
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 170%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--pink-400);
      box-shadow: 0 0 10px var(--glow);
    }

    .alarm-hammer::after {
      /* striking head */
      content: "";
      position: absolute;
      top: -16%;
      left: 50%;
      transform: translateX(-50%);
      width: 260%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, var(--pink-100), var(--pink-500) 75%);
      box-shadow: 0 0 12px rgba(var(--accent-rgb), .6);
    }

    .alarm.ringing .alarm-hammer {
      animation: alarmHammer .16s linear infinite alternate;
    }

    @keyframes alarmHammer {
      from {
        transform: translateX(-50%) rotate(-18deg);
      }

      to {
        transform: translateX(-50%) rotate(18deg);
      }
    }

    /* face */
    .alarm-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 32%, #1d1d25, #0b0b0f 78%);
      border: 2px solid rgba(var(--accent-rgb), .55);
      box-shadow: 0 0 34px rgba(var(--accent-rgb), .22), inset 0 0 26px rgba(0, 0, 0, .65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alarm-face::before {
      /* tick marks */
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background: repeating-conic-gradient(from -1deg, rgba(var(--accent-hi-rgb), .55) 0 2deg, transparent 2deg 30deg);
      -webkit-mask: radial-gradient(circle, transparent 0 88%, #000 88% 92%, transparent 92%);
      mask: radial-gradient(circle, transparent 0 88%, #000 88% 92%, transparent 92%);
    }

    .alarm-hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--pink-200), var(--pink-400));
      box-shadow: 0 0 8px rgba(var(--accent-rgb), .5);
      transition: transform .9s cubic-bezier(.2, .7, .2, 1);
    }

    .alarm-hand.h {
      width: 5.5%;
      height: 26%;
      margin-left: -2.75%;
    }

    .alarm-hand.m {
      width: 3.5%;
      height: 38%;
      margin-left: -1.75%;
    }

    .alarm-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--pink-300);
      box-shadow: 0 0 10px var(--glow);
    }

    .alarm-time {
      position: absolute;
      bottom: 13%;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 200;
      font-size: clamp(15px, 3.6vh, 21px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      color: rgb(var(--accent-lo-rgb));
      /* on a dark device face: keep the bright shade in light mode too */
      text-shadow: 0 0 14px var(--glow);
      white-space: nowrap;
    }

    .alarm.ringing .alarm-time {
      animation: alarmTimePulse .5s ease-in-out infinite alternate;
    }

    @keyframes alarmTimePulse {
      from {
        opacity: .7;
      }

      to {
        opacity: 1;
        text-shadow: 0 0 22px var(--glow);
      }
    }

    /* feet */
    .alarm-foot {
      position: absolute;
      bottom: -7%;
      width: 16%;
      height: 9%;
      border-radius: 0 0 50% 50%;
      background: linear-gradient(180deg, #1c1c24, #0d0d11);
      border: 1px solid rgba(var(--accent-rgb), .35);
      border-top: none;
    }

    .alarm-foot.left {
      left: 6%;
      transform: rotate(14deg);
    }

    .alarm-foot.right {
      right: 6%;
      transform: rotate(-14deg);
    }

    /* sound waves arcing off the bells */
    .alarm-wave {
      position: absolute;
      top: -16%;
      width: 44%;
      aspect-ratio: 1;
      border: 2px solid rgba(var(--accent-hi-rgb), .65);
      border-radius: 50%;
      border-bottom-color: transparent;
      border-left-color: transparent;
      opacity: 0;
      pointer-events: none;
    }

    .alarm-wave.w1 {
      left: -30%;
      transform: rotate(-18deg);
    }

    .alarm-wave.w2 {
      left: -30%;
      transform: rotate(-18deg);
    }

    .alarm-wave.w3 {
      right: -30%;
      transform: rotate(18deg) scaleX(-1);
    }

    .alarm.ringing .alarm-wave {
      animation: alarmWave 1.1s ease-out infinite;
    }

    .alarm.ringing .alarm-wave.w2 {
      animation-delay: .35s;
    }

    .alarm.ringing .alarm-wave.w3 {
      animation-delay: .18s;
    }

    @keyframes alarmWave {
      0% {
        opacity: 0;
        scale: .7;
      }

      25% {
        opacity: .8;
      }

      100% {
        opacity: 0;
        scale: 1.25;
      }
    }

    /* snooze indicator */
    .alarm-zzz {
      position: absolute;
      top: -14%;
      right: -16%;
      font-size: clamp(14px, 3vh, 18px);
      font-weight: 600;
      color: var(--pink-300);
      letter-spacing: .15em;
      opacity: 0;
      transition: opacity .4s ease;
      animation: zzzFloat 2.2s ease-in-out infinite;
    }

    .alarm.snoozed .alarm-zzz {
      opacity: .9;
    }

    @keyframes zzzFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .alarm-sub {
      position: relative;
      z-index: 2;
      margin-top: clamp(18px, 3.6vh, 32px);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--pink-300);
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .5s ease .15s, transform .5s ease .15s;
    }

    .alarm.show .alarm-sub {
      opacity: .9;
      transform: none;
    }

    .alarm-btns {
      position: relative;
      z-index: 2;
      display: flex;
      gap: clamp(14px, 3vw, 26px);
      margin-top: clamp(12px, 2.6vh, 22px);
    }

    .alarm-btn {
      width: clamp(52px, 11vh, 64px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), .5);
      background: rgba(var(--surface-rgb), .7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--pink-200);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .08em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease, box-shadow .2s ease;
    }

    .alarm-btn.stop {
      border-color: rgba(var(--accent-rgb), .8);
      color: var(--pink-300);
      font-size: 17px;
    }

    .alarm-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 34px rgba(var(--accent-rgb), .4);
    }

    .alarm-btn:active {
      transform: scale(.94);
    }

    /* snooze only makes sense while ringing */
    .alarm:not(.ringing):not(.snoozed) .alarm-btn.snooze {
      display: none;
    }

    /* ---------- pending alarms (top-left, under the reminder chip) ---------- */
    .alarmChip {
      position: fixed;
      left: 16px;
      top: 18px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 60vw;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease, top .4s ease;
    }

    .alarmChip.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    body.has-reminders .alarmChip {
      top: 62px;
    }

    .apill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(var(--accent-rgb), .07);
      border: 1px solid rgba(var(--accent-rgb), .28);
      color: var(--pink-200);
      padding: 7px 12px;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .apill:hover {
      background: rgba(var(--accent-rgb), .14);
      border-color: rgba(var(--accent-rgb), .55);
    }

    .apill .asn {
      color: var(--muted);
      font-size: 11px;
    }

    .apill .ax {
      opacity: .45;
      font-size: 10px;
    }

    .apill:hover .ax {
      opacity: 1;
    }

    /* while the alarm is the hero, fade the rest back (same as the timer / AC) */
    body.alarm-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.alarm-active .wordmark {
      opacity: .12;
    }

    body.alarm-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }

    /* ---------- theme switch (COLOR intent) ----------
     "red" / "green" / "blue" retint the whole UI: JS tweens the theme
     variables in :root, and this sweep washes the new color out from the
     center so the change reads as one gesture. */
    .theme-sweep {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      background: radial-gradient(circle, rgba(var(--sweep-rgb), .5) 0%, rgba(var(--sweep-rgb), .16) 45%, rgba(var(--sweep-rgb), 0) 70%);
    }

    .theme-sweep.go {
      animation: themeSweep 1.3s cubic-bezier(.2, .7, .3, 1) forwards;
    }

    @keyframes themeSweep {
      0% {
        transform: scale(1);
        opacity: .95;
      }

      100% {
        transform: scale(320);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-sweep.go {
        animation: none;
      }
    }

    /* ---------- hint ---------- */
    .hint {
      font-size: clamp(12px, 3vw, 14px);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: .8;
      transition: opacity .4s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .hint.hidden {
      opacity: 0;
    }

    /* start pill */
    .start {
      position: fixed;
      left: 50%;
      bottom: clamp(28px, 7vh, 64px);
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), .08);
      border: 1px solid rgba(var(--accent-rgb), .35);
      color: var(--pink-200);
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background .3s ease, border-color .3s ease, transform .2s ease, opacity .4s ease;
      animation: pulse 2.6s ease-in-out infinite;
      z-index: 5;
    }

    .start:hover {
      background: rgba(var(--accent-rgb), .16);
      border-color: var(--pink-400);
    }

    .start:active {
      transform: translateX(-50%) scale(.97);
    }

    /* own class: ".ring" belongs to the call screen's absolutely positioned sonar rings */
    .start-dot {
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--pink-500);
      box-shadow: 0 0 12px var(--glow);
      animation: dotBlink 1.6s ease-in-out infinite;
    }

    @keyframes dotBlink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .35;
        transform: scale(.8);
      }
    }

    .start.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .0);
      }

      50% {
        box-shadow: 0 0 26px 2px rgba(var(--accent-rgb), .18);
      }
    }

    /* tiny status dot (live) */
    /* top-right row: live status, then the weather chip (shared so they
       can't overlap, whatever width the place name has) */
    .topbar {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity .4s ease;
    }

    .live.show {
      opacity: .85;
    }

    .live .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .3s, box-shadow .3s;
    }

    .live.on .led {
      background: var(--pink-500);
      box-shadow: 0 0 10px var(--glow);
    }

    /* latency chip (debug, hidden by default) */
    .latency {
      position: fixed;
      top: 66px;
      /* below the reminders chip */
      left: 22px;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      opacity: .55;
      z-index: 5;
    }

    body.debug .latency {
      opacity: .9;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(var(--accent-rgb), .12);
      border: 1px solid rgba(var(--accent-rgb), .3);
      color: var(--pink-200);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      letter-spacing: .03em;
      opacity: 0;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 9;
      max-width: 80vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* ---------- weather chip (top-right) ---------- */
    .weather {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(var(--accent-rgb), .07);
      border: 1px solid rgba(var(--accent-rgb), .22);
      color: var(--pink-200);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .02em;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      transition: border-color .25s ease, background .25s ease;
      font-variant-numeric: tabular-nums;
    }

    .weather:hover {
      border-color: rgba(var(--accent-rgb), .55);
      background: rgba(var(--accent-rgb), .12);
    }

    .weather .wicon {
      font-size: 14px;
      line-height: 1;
      filter: saturate(.85);
    }

    .weather .wt {
      color: var(--white);
      font-weight: 600;
    }

    .weather .wloc {
      color: var(--muted);
      font-size: 11px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weather.loading .wt {
      color: var(--muted);
      font-weight: 400;
    }

    /* ---------- music player card (bottom-center, appears when a track plays) ---------- */
    .player {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 6;
      width: min(92vw, 380px);
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(rgba(var(--accent-rgb), .05), rgba(var(--accent-rgb), .05)), rgba(var(--surface-rgb), .9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(var(--accent-rgb), .30);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 0 26px rgba(var(--accent-rgb), .10);
      opacity: 0;
      transform: translate(-50%, 16px) scale(.97);
      pointer-events: none;
      transition: opacity .45s cubic-bezier(.2, .7, .3, 1), transform .45s cubic-bezier(.2, .7, .3, 1),
        box-shadow .5s ease, border-color .5s ease;
    }

    .player.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .player.playing {
      border-color: rgba(var(--accent-rgb), .55);
      box-shadow: 0 12px 44px rgba(0, 0, 0, .6), 0 0 34px rgba(var(--accent-rgb), .22);
    }

    .pcov {
      flex: none;
      width: 58px;
      height: 58px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), .24), rgba(var(--accent-rgb), .04)), var(--bg-soft);
      border: 1px solid rgba(var(--accent-rgb), .35);
      position: relative;
    }

    .pcov img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: coverIn .6s cubic-bezier(.2, .7, .3, 1);
    }

    .pcov .ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      opacity: .8;
    }

    @keyframes coverIn {
      from {
        transform: scale(1.18);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .pmeta {
      flex: 1;
      min-width: 0;
    }

    .ptitle {
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: slideIn .5s ease;
    }

    .partist {
      color: var(--pink-200);
      font-size: 11.5px;
      letter-spacing: .03em;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes slideIn {
      from {
        transform: translateX(10px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .pbar {
      height: 3px;
      border-radius: 2px;
      background: rgba(var(--line-rgb), .10);
      margin-top: 9px;
      cursor: pointer;
      position: relative;
    }

    .pbar .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--pink-600), var(--pink-400));
      box-shadow: 0 0 8px rgba(var(--accent-rgb), .6);
    }

    .ptime {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }

    .pctrl {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pbtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), .35);
      background: rgba(var(--accent-rgb), .10);
      color: var(--pink-200);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .15s ease, color .2s ease;
    }

    .pbtn:hover {
      background: rgba(var(--accent-rgb), .24);
      color: var(--white);
    }

    .pbtn:active {
      transform: scale(.9);
    }

    .pbtn.main {
      width: 44px;
      height: 44px;
      font-size: 15px;
      color: var(--white);
      background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
      border: none;
      box-shadow: 0 4px 16px rgba(var(--accent-rgb), .4);
    }

    .pbtn.main:hover {
      filter: brightness(1.12);
      background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
    }

    .player.paused .pbtn.main {
      animation: pulseP 1.6s ease-in-out infinite;
    }

    @keyframes pulseP {

      0%,
      100% {
        box-shadow: 0 4px 16px rgba(var(--accent-rgb), .35);
      }

      50% {
        box-shadow: 0 4px 26px rgba(var(--accent-rgb), .75);
      }
    }

    .pvol {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pvol button {
      width: 22px;
      height: 20px;
      border-radius: 6px;
      border: 1px solid rgba(var(--accent-rgb), .25);
      background: transparent;
      color: var(--pink-200);
      font-size: 9px;
      cursor: pointer;
      transition: background .2s ease;
    }

    .pvol button:hover {
      background: rgba(var(--accent-rgb), .18);
    }

    .pvol button:disabled {
      opacity: .35;
      cursor: default;
      background: transparent;
    }

    .pvlvl {
      width: 22px;
      text-align: center;
      font-size: 9px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- reminder chip (top-left; shows saved count, tap to list) ---------- */
    .remChip {
      position: fixed;
      left: 16px;
      top: 18px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(var(--accent-rgb), .07);
      border: 1px solid rgba(var(--accent-rgb), .28);
      color: var(--pink-200);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .02em;
      -webkit-user-select: none;
      user-select: none;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
    }

    .remChip.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .remChip .rbell {
      font-size: 14px;
      line-height: 1;
      display: inline-block;
    }

    .remChip .rcount {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--pink-500);
      color: #fff;
      font-weight: 600;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--glow);
    }

    .remChip.bell-swing .rbell {
      animation: bellSwing .9s ease;
    }

    @keyframes bellSwing {

      0%,
      100% {
        transform: rotate(0);
      }

      15% {
        transform: rotate(18deg);
      }

      35% {
        transform: rotate(-14deg);
      }

      55% {
        transform: rotate(9deg);
      }

      75% {
        transform: rotate(-5deg);
      }
    }

    .remChip.pop .rcount {
      animation: remPop .5s cubic-bezier(.2, .7, .2, 1);
    }

    @keyframes remPop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.35);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ---------- reminder panel (slides up on LIST_REMINDERS or chip tap) ---------- */
    .remPanel {
      position: fixed;
      left: 50%;
      bottom: clamp(24px, 8vh, 64px);
      z-index: 6;
      width: min(92vw, 420px);
      transform: translate(-50%, 24px) scale(.97);
      background: rgba(var(--surface-rgb), .92);
      border: 1px solid rgba(var(--accent-rgb), .3);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(var(--accent-rgb), .12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s cubic-bezier(.2, .7, .2, 1), transform .45s cubic-bezier(.2, .7, .2, 1);
    }

    .remPanel.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      pointer-events: auto;
    }

    .remHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
    }

    .remHead .rh-title {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--pink-300);
      font-weight: 500;
    }

    .remHead .rh-close {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), .35);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, color .2s ease;
    }

    .remHead .rh-close:hover {
      background: rgba(var(--accent-rgb), .18);
      color: var(--white);
    }

    .remList {
      padding: 2px 10px 12px;
      max-height: 40vh;
      overflow-y: auto;
    }

    .remRow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(14px);
      animation: remRowIn .5s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    .remRow+.remRow {
      margin-top: 4px;
    }

    @keyframes remRowIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .remRow .rr-bell {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(var(--accent-rgb), .1);
      border: 1px solid rgba(var(--accent-rgb), .3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .remRow .rr-task {
      font-size: 15px;
      font-weight: 400;
      color: var(--white);
      letter-spacing: .02em;
    }

    .remRow .rr-when {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .05em;
    }

    .remEmpty {
      padding: 18px 16px 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .03em;
    }

    /* ---------- message (MESSAGE intent) — chat bubble ----------
       typing (dots bounce) -> typing text (typewriter + caret) ->
       sent (paper plane flies away, double check pops) -> fade to idle.
       Same scene contract as the call / alarm: owns the hold, one-shot
       fade, voice "stop" ends it early, the ✕ button does too. */
    .msg {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vh, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s cubic-bezier(.2, .7, .2, 1);
    }

    .msg.show {
      opacity: 1;
      pointer-events: auto;
    }

    .msg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(72vw, 420px);
      aspect-ratio: 1;
      transform: translate(-50%, -58%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), .16), transparent 65%);
      animation: glowPulse 2.8s ease-in-out infinite;
    }

    .msg-to {
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      animation: nameIn .5s ease .05s backwards;
    }

    .msg-bubble {
      position: relative;
      max-width: min(84vw, 400px);
      padding: clamp(14px, 2.6vh, 20px) clamp(18px, 3.4vw, 26px);
      background: linear-gradient(160deg, rgba(var(--accent-rgb), .16), rgba(var(--accent-rgb), .05));
      border: 1px solid rgba(var(--accent-rgb), .45);
      border-radius: 22px 22px 22px 6px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 34px rgba(var(--accent-rgb), .14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-height: 58px;
      animation: bubbleIn .55s cubic-bezier(.2, .9, .3, 1.35);
    }

    @keyframes bubbleIn {
      0% {
        transform: scale(.6) translateY(14px);
        opacity: 0;
      }
      100% {
        transform: none;
        opacity: 1;
      }
    }

    .msg-text {
      font-size: clamp(17px, 3.2vh, 22px);
      font-weight: 300;
      color: var(--white);
      letter-spacing: .02em;
      line-height: 1.45;
      min-height: 1.45em;
      text-shadow: 0 0 18px var(--glow);
    }

    .msg-caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.12em;
      background: var(--pink-300);
      box-shadow: 0 0 8px var(--glow);
      animation: caretBlink .8s steps(1) infinite;
    }

    @keyframes caretBlink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    /* typing dots */
    .msg-dots {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 1.45em;
    }

    .msg-dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pink-300);
      box-shadow: 0 0 10px var(--glow);
      animation: dotBounce 1.1s ease-in-out infinite;
    }

    .msg-dots i:nth-child(2) {
      animation-delay: .15s;
    }

    .msg-dots i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes dotBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .5;
      }
      30% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    /* paper plane — flies away on send */
    .msg-plane {
      position: absolute;
      top: -16px;
      right: -14px;
      width: 34px;
      height: 34px;
      padding: 6px;
      border-radius: 50%;
      background: var(--pink-500);
      box-shadow: 0 0 18px rgba(var(--accent-rgb), .6);
      opacity: 0;
      transform: rotate(45deg) scale(.4);
      transition: opacity .25s ease, transform .25s ease;
    }

    .msg.sent .msg-plane {
      opacity: 1;
      transform: rotate(45deg) scale(1);
    }

    .msg.sent .msg-plane svg {
      animation: planeFly 1.15s cubic-bezier(.5, -.1, .75, .4) .25s forwards;
    }

    .msg-plane svg {
      width: 100%;
      height: 100%;
      fill: #fff;
      transform-origin: center;
    }

    @keyframes planeFly {
      0% {
        transform: translate(0, 0) rotate(0);
        opacity: 1;
      }
      100% {
        transform: translate(110px, -110px) rotate(14deg) scale(.55);
        opacity: 0;
      }
    }

    /* double check — pops in under the bubble after send */
    .msg-checks {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: scale(.5);
      transition: opacity .35s ease, transform .35s cubic-bezier(.2, .9, .3, 1.4);
    }

    .msg.sent .msg-checks {
      opacity: 1;
      transform: none;
      transition-delay: .5s;
    }

    .msg-checks svg {
      width: 15px;
      height: 15px;
      stroke: var(--pink-300);
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--glow));
    }

    .msg-checks .ck2 {
      margin-left: -7px;
      stroke: var(--pink-500);
    }

    .msg-status {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .08em;
      animation: nameIn .5s ease .2s backwards;
    }

    .msg-close {
      position: absolute;
      top: 64px;
      /* below the live / weather row */
      right: clamp(18px, 5vw, 40px);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), .5);
      background: rgba(var(--surface-rgb), .7);
      color: var(--pink-300);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, box-shadow .2s ease;
      animation: btnIn .5s ease .3s backwards;
    }

    .msg-close:hover {
      transform: scale(1.1);
      box-shadow: 0 0 24px rgba(var(--accent-rgb), .4);
    }

    .msg-close:active {
      transform: scale(.92);
    }

    /* while the message is the hero, fade the rest back (same as the call) */
    body.msg-active .wave-wrap {
      opacity: .12;
      transition: opacity .5s ease;
    }

    body.msg-active .wordmark {
      opacity: .12;
    }

    body.msg-active .status {
      margin-bottom: clamp(110px, 22vh, 170px);
    }
  </style>
</head>

<body>
  <div class="latency" id="latency"></div>
  <div class="topbar">
    <div class="live" id="live"><span class="led"></span><span id="liveTxt">off</span></div>
    <div class="weather loading" id="weather" title="tap to refresh">
      <span class="wicon" id="wIcon">☁️</span>
      <span class="wt" id="wTemp">--°</span>
      <span class="wloc" id="wLoc">locating…</span>
    </div>
  </div>

  <!-- music player card (local MP3s from the data/music/ folder) -->
  <div class="player" id="player">
