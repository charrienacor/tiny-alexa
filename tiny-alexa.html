  <button class="start" id="start"><span class="start-dot"></span><span id="startTxt">tap to listen</span></button>
  <div class="toast" id="toast"></div>

  <script>
    "use strict";
    /* =====================================================================
       tiny alexa — front end
       - Captures the mic, streams 16 kHz int16 PCM to a local WebSocket
         server (src/server.py) which runs openWakeWord + the TCN (models/TCN.onnx).
       - Renders a real-time, smooth pink sound-wave from the mic (AnalyserNode)
         and drives the whole state machine from server events.
       - Runs entirely offline once the server is up. No CDN, no external files.
       ===================================================================== */

    const SR = 16000;              // model sample rate
    const CHUNK = 1280;            // 80 ms at 16 kHz (openWakeWord chunk size)

    /* ---- randomized spoken-style responses ---- */
    // demo only; the live server picks its own (src/server.py WAKE_PHRASES)
    const WAKE_PHRASES = ["Uh-huh", "Yes", "Yeah?", "I’m here", "Go ahead", "I’m listening", "Here", "Yes?"];
    const CONFIRM_PHRASES = ["Got it", "Okay", "Sure", "On it", "Done", "Alright", "Will do", "No problem"];

    /* ---- human-readable command text (mirrors src/infer.py INTENT_MESSAGES) ---- */
    const INTENT_MESSAGES = {
      PLAY_MUSIC: "Playing music", PAUSE: "Paused playback", STOP: "Stopped playback",
      NEXT: "Skipping to the next song", VOLUME_UP: "Turning the volume up",
      VOLUME_DOWN: "Turning the volume down", LIGHT_ON: "Turning the lights on",
      LIGHT_OFF: "Turning the lights off", BRIGHTNESS: "Brightness set to {slot}",
      COLOR: "Theme set to {slot}", TEMPERATURE: "Temperature set to {slot}",
      TIMER: "Timer started for {slot}", ALARM: "Alarm set for {slot}",
      CALL: "Starting a call", MESSAGE: "Sending a message",
      WEATHER: "{weather}", TIME: "It’s {slot}",
      CREATE_REMINDER: "Reminder created: {slot}", LIST_REMINDERS: "No reminders yet"
    };

    /* ============================ DOM ============================ */
    const el = id => document.getElementById(id);
    const wordmark = el("wordmark"), phraseEl = el("phrase"), detailEl = el("detail"),
      hintEl = el("hint"), startBtn = el("start"), startTxt = el("startTxt"),
      liveEl = el("live"), liveTxt = el("liveTxt"), latencyEl = el("latency"), toastEl = el("toast");

    const DEMO = new URLSearchParams(location.search).has("demo");
    const DEBUG = new URLSearchParams(location.search).has("debug");
    if (DEBUG) document.body.classList.add("debug");

    /* ============================ STATE ============================ */
    let state = "idle";            // idle | awake | listening | result
    let ws = null, actx = null, analyser = null, freqData = null;
    const pcmOut = new Int16Array(CHUNK); // one 80 ms chunk being filled
    let pcmFill = 0;
    let rsPos = 0, rsPrev = 0;     // resampler phase + last input sample, carried across blocks
    let energy = 0;                // 0=idle, 1=active (smoothed, drives waveform+color)
    let lastLatency = 0;

    const rand = a => a[(Math.random() * a.length) | 0];

    /* =====================================================================
       WEATHER — open-meteo (free, open-source, no API key, CORS enabled)
       Browser calls the API directly; nothing touches the Pi's CPU.
       Location: browser Geolocation if allowed, else ipinfo.io (free, no key).
       GPS coordinates are named via the server's /geo (OpenStreetMap
       Nominatim), falling back to the IP city, then to the raw coordinates.
       ===================================================================== */
    const WEATHER_CODE = {
      0: ["clear sky", "☀️"], 1: ["mostly clear", "🌤️"], 2: ["partly cloudy", "⛅"], 3: ["overcast", "☁️"],
      45: ["foggy", "🌫️"], 48: ["icing fog", "🌫️"],
      51: ["light drizzle", "🌦️"], 53: ["drizzle", "🌦️"], 55: ["heavy drizzle", "🌧️"],
      56: ["freezing drizzle", "🌧️"], 57: ["freezing drizzle", "🌧️"],
      61: ["light rain", "🌦️"], 63: ["rain", "🌧️"], 65: ["heavy rain", "🌧️"],
      66: ["freezing rain", "🌧️"], 67: ["freezing rain", "🌧️"],
      71: ["light snow", "🌨️"], 73: ["snow", "❄️"], 75: ["heavy snow", "❄️"], 77: ["snow grains", "❄️"],
      80: ["light showers", "🌦️"], 81: ["showers", "🌧️"], 82: ["heavy showers", "⛈️"],
      85: ["snow showers", "🌨️"], 86: ["snow showers", "🌨️"],
      95: ["thunderstorm", "⛈️"], 96: ["thunderstorm with hail", "⛈️"], 99: ["thunderstorm with hail", "⛈️"],
    };
    const wEl = document.getElementById("weather"),
      wIconEl = document.getElementById("wIcon"),
      wTempEl = document.getElementById("wTemp"),
      wLocEl = document.getElementById("wLoc");
    let wx = null;                    // last fetched weather
    let wxBusy = false;

    async function getLocation() {
      if ("geolocation" in navigator) {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { timeout: 4000, maximumAge: 600000 }));
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        return { lat, lon, ...(await placeName(lat, lon)), via: "gps" };
      }
      throw new Error("no geolocation");
    }
    // "14.6507, 121.0316" -> {place: "Quezon City", full: "Quezon City, Metro Manila, Philippines"}
    async function placeName(lat, lon) {
      try {
        const r = await fetch(`geo?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}`,
          { signal: AbortSignal.timeout(8000) });
        const j = await r.json();
        if (r.ok && j.place) {
          return { place: j.place, full: [j.place, j.region, j.country].filter(Boolean).join(", ") };
        }
      } catch (e) { /* server offline / page opened from file:// */ }
      try {
        const ip = await getIpLocation();          // same city as the GPS fix, usually
        if (Math.hypot(ip.lat - lat, ip.lon - lon) < 0.5) return { place: ip.place, full: ip.full };
      } catch (e) { /* no network */ }
      const deg = (v, pos, neg) => `${Math.abs(v).toFixed(2)}°${v >= 0 ? pos : neg}`;
      const coords = `${deg(lat, "N", "S")}, ${deg(lon, "E", "W")}`;
      return { place: coords, full: coords };
    }
    async function getIpLocation() {
      const r = await fetch("https://ipinfo.io/json", { signal: AbortSignal.timeout(4000) });
      if (!r.ok) throw new Error("ipinfo " + r.status);
      const j = await r.json();
      const [lat, lon] = String(j.loc || "").split(",").map(Number);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error("ipinfo no loc");
      const place = j.city || j.region || j.country || "your area";
      const full = [j.city, j.region, j.country].filter(Boolean)
        .filter((v, i, a) => a.indexOf(v) === i).join(", ") || place;
      return { lat, lon, place, full, via: "ip" };
    }
    async function fetchWeather() {
      if (wxBusy) return; wxBusy = true;
      wEl.classList.add("loading");
      try {
        let loc;
        try { loc = await getLocation(); } catch (e) { loc = await getIpLocation(); }
        const qs = `latitude=${loc.lat.toFixed(4)}&longitude=${loc.lon.toFixed(4)}`
          + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
          + "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
        const r = await fetch("https://api.open-meteo.com/v1/forecast?" + qs,
          { signal: AbortSignal.timeout(6000) });
        if (!r.ok) throw new Error("open-meteo " + r.status);
        const j = await r.json();
        const c = j.current, d = j.daily;
        const [desc, icon] = WEATHER_CODE[c.weather_code] || ["unknown", "🌡️"];
        wx = {
          desc, icon,
          temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature),
          hum: c.relative_humidity_2m, wind: Math.round(c.wind_speed_10m),
          hi: Math.round(d.temperature_2m_max[0]), lo: Math.round(d.temperature_2m_min[0]),
          place: loc.place, full: loc.full || loc.place, via: loc.via, tz: j.timezone
        };
        wIconEl.textContent = wx.icon;
        wTempEl.textContent = wx.temp + "°";
        wLocEl.textContent = wx.place;
        wEl.title = `${wx.full} (${wx.via === "gps" ? "GPS" : "approx., from IP"}) · ${desc} · ${wx.temp}°C (feels ${wx.feels}°) · humidity ${wx.hum}% · wind ${wx.wind} km/h · high ${wx.hi}° low ${wx.lo}° · ${wx.tz}`;
        wEl.classList.remove("loading");
      } catch (e) {
        wIconEl.textContent = "🌐"; wTempEl.textContent = "--°";
        wLocEl.textContent = "offline";
        wEl.title = "weather unavailable: " + e.message;
      } finally { wxBusy = false; }
    }
    wEl.addEventListener("click", e => { e.stopPropagation(); fetchWeather(); });

    /* =====================================================================
       WAVEFORM  — smooth, flowing pink bars on a canvas
       ===================================================================== */
    const canvas = el("wave"), ctx = canvas.getContext("2d");
    const NBARS = 48;
    let bars = new Float32Array(NBARS);      // current (smoothed) heights 0..1
    let W = 0, H = 0, DPR = 1;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener("resize", resize);


    // Byte spectrum -> NBARS heights in 0..1 over 0-4.8 kHz (the voice
    // range), log-spaced so the low end gets more bars. `rate` is the
    // analyser's sample rate: the spectrum spans 0..rate/2.
    const BAR_MAX_HZ = 4800;
    function spectrumToBars(spec, rate) {
      const out = new Float32Array(NBARS);
      const usable = Math.max(2, Math.floor(spec.length * Math.min(1, BAR_MAX_HZ / (rate / 2))));
      for (let i = 0; i < NBARS; i++) {
        const a = Math.floor(Math.pow(i / NBARS, 1.35) * (usable - 1));
        const b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / NBARS, 1.35) * (usable - 1)));
        let sum = 0; for (let k = a; k < b; k++) sum += spec[k];
        out[i] = Math.min(1, Math.pow((sum / (b - a)) / 255, 0.82) * 1.15);
      }
      return out;
    }

    function draw(t) {
      requestAnimationFrame(draw);
      if (!W) resize();

      // target heights
      let targets;
      if (mMusicAn && mFreqData && mStarted && !player.paused) {
        // music is playing — the wave dances to the track
        mMusicAn.getByteFrequencyData(mFreqData);
        targets = spectrumToBars(mFreqData, musicCtx.sampleRate);
      } else if (analyser && (state === "awake" || state === "listening" || state === "result")) {
        analyser.getByteFrequencyData(freqData);
        targets = spectrumToBars(freqData, actx.sampleRate);
      } else {
        // idle: gentle breathing wave
        targets = new Float32Array(NBARS);
        for (let i = 0; i < NBARS; i++) {
          const c = i / (NBARS - 1);
          const env = Math.sin(c * Math.PI);                 // taller in the middle
          const w1 = Math.sin(t * 0.0016 + i * 0.34);
          const w2 = Math.sin(t * 0.0042 + i * 0.9 + 1.7);
          targets[i] = (0.10 + 0.085 * w1 + 0.035 * w2) * (0.55 + 0.45 * env);
        }
      }

      // smooth toward targets (flowing, not jittery)
      const alpha = 0.28;
      for (let i = 0; i < NBARS; i++) bars[i] += (targets[i] - bars[i]) * alpha;

      // energy (state transition) smoothing
      const targetEnergy = (state === "awake" || state === "listening" || state === "result") ? 1 : 0;
      energy += (targetEnergy - energy) * 0.08;

      // ---- paint ----
      ctx.clearRect(0, 0, W, H);
      const gap = 3;
      const bw = (W - gap * (NBARS - 1)) / NBARS;
      const base = H * 0.5;
      const maxH = H * 0.46;

      const topCol = rgbA(theme[300], 0.55 + 0.45 * energy);
      const botCol = rgbA(theme[600], 0.35 + 0.55 * energy);

      ctx.lineCap = "round";
      for (let i = 0; i < NBARS; i++) {
        const h = Math.max(2, bars[i] * maxH);
        const x = i * (bw + gap) + bw / 2;
        const g = ctx.createLinearGradient(0, base - h, 0, base + h);
        g.addColorStop(0, topCol);
        g.addColorStop(1, botCol);
        ctx.strokeStyle = g;
        ctx.lineWidth = bw;
        ctx.shadowColor = rgbA(theme[500], 0.25 + 0.5 * energy);
        ctx.shadowBlur = (6 + 22 * energy) * Math.min(1, bars[i] + 0.15);
        ctx.beginPath();
        ctx.moveTo(x, base - h);
        ctx.lineTo(x, base + h);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // timer ring + aircon + color (share this rAF — no second loop)
      tickTimer();
      tickAc();
      tickTheme(t);
      tickLamp();
      tickCall();
      tickAlarm();
      tickMessage();

      // latency readout
      if (DEBUG && lastLatency > 0)
        latencyEl.textContent = `tcn ${lastLatency.toFixed(0)} ms   state ${state}`;
    }
    requestAnimationFrame(draw);

    /* =====================================================================
       REMINDERS  — in-memory list + chip + slide-up panel
       CREATE_REMINDER adds {task, ts}; LIST_REMINDERS shows the list.
       The list lives only in this page, so every reload starts with no
       reminders. The panel animates in with staggered rows; the chip's bell
       swings when a new reminder lands.
       ===================================================================== */
    let reminders = [];
    // earlier versions kept reminders in localStorage; drop that copy
    try { localStorage.removeItem("tiny-alexa.reminders.v1"); } catch (e) { }

    const remChip = el("remChip"), remCount = el("remCount"),
      remPanel = el("remPanel"), remList = el("remList"), remClose = el("remClose");

    function fmtWhen(ts) {
      const d = new Date(ts), now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const hm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      if (sameDay) return "today " + hm;
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return "yesterday " + hm;
      return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + hm;
    }

    function updateRemChip() {
      remCount.textContent = reminders.length;
      remChip.classList.toggle("show", reminders.length > 0);
      document.body.classList.toggle("has-reminders", reminders.length > 0);
    }

    function addReminder(task) {
      const t = String(task || "reminder").trim();
      reminders.unshift({ task: t, ts: Date.now() });   // newest first
      updateRemChip();
      // chip pops in (or bumps), bell swings
      remChip.classList.remove("pop", "bell-swing");
      void remChip.offsetWidth;                     // restart animations
      remChip.classList.add("pop", "bell-swing");
      return t;
    }

    function renderRemList() {
      remList.innerHTML = "";
      if (!reminders.length) {
        remList.innerHTML = '<div class="remEmpty">no reminders yet — say “set a reminder”</div>';
        return;
      }
      reminders.slice(0, 12).forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "remRow";
        row.style.animationDelay = (i * 70) + "ms";       // staggered cascade
        row.innerHTML = `<span class="rr-bell">🔔</span>
      <span class="rr-task">${esc(r.task)}</span>
      <span class="rr-when">${fmtWhen(r.ts)}</span>`;
        remList.appendChild(row);
      });
    }

    let remPanelTimer = null;
    function showRemPanel(holdMs) {
      renderRemList();
      remPanel.classList.add("show");
      clearTimeout(remPanelTimer);
      remPanelTimer = setTimeout(hideRemPanel, holdMs || 4200);
    }
    function hideRemPanel() { remPanel.classList.remove("show"); }
    remClose.addEventListener("click", hideRemPanel);
    updateRemChip();

    /* =====================================================================
       STATE MACHINE  — text + waveform state
       ===================================================================== */
    let wakeTimer = null, resultTimer = null;

    function setPhrase(text, kind) {
      clearTimeout(wakeTimer); clearTimeout(resultTimer);
      phraseEl.className = "phrase";
      detailEl.className = "detail";
      // force reflow so re-triggering the transition works
      void phraseEl.offsetWidth;
      phraseEl.textContent = text;
      phraseEl.classList.add(kind, "show");
      document.body.classList.add("busy");
    }

    // m: the server's "awake" event — it picks the reply (src/server.py
    // WAKE_PHRASES) and stays deaf while it plays. The demo passes nothing.
    function onAwake(m) {
      state = "awake";
      stopSpeaking();                // barge-in: don't record our own reply
      mDuck(true);                   // quieter music so the command is heard
      const phrase = (m && m.phrase) || rand(WAKE_PHRASES);
      setPhrase(phrase, "wake");
      if (m && m.speak) speak(phrase);
      hintEl.textContent = "listening…";
      // brief wake beat, then settle into listening
      setTimeout(() => { if (state === "awake") { state = "listening"; } }, 900);
    }

    function onResult(r) {
      state = "result";
      mDuck(false);
      if (alarmFinishing) dismissAlarm();     // an alarm scene on its way out yields at once
      // a timer's "stopped" / "time's up" dismissal may still be pending — cancel
      // it now so this result owns the UI (otherwise the ring lingers behind it)
      let timerWasDismissal = false;
      if (timerDone) {
        timerWasDismissal = true;
        clearTimeout(resultTimer);
        timerDone = false;
        timerEl.classList.remove("show", "done", "urgent");
        document.body.classList.remove("timer-active");
      }
      const confirm = rand(CONFIRM_PHRASES);
      let detail = "";
      let holdMs = 3200;
      let spoken = confirm;
      if (r && r.intent) {
        let msg = INTENT_MESSAGES[r.intent] || r.intent;
        if (r.intent === "TIME") {
          const d = new Date();
          msg = "It’s " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }
        if (r.intent === "ALARM" && !DEMO) {
          const p = alarmPreview(r.slot);
          const tomorrow = new Date(p.at).toDateString() !== new Date().toDateString();
          msg = p.exists ? `Your ${p.t.label} alarm is already set`
            : `Alarm set for ${p.t.label}${tomorrow ? " tomorrow" : ""} — in ${fmtIn(p.at - Date.now())}`;
        }
        if (r.intent === "VOLUME_UP" || r.intent === "VOLUME_DOWN") {
          const up = r.intent === "VOLUME_UP", next = mNextVol(up);
          msg = next === mVol ? (up ? `Volume is already at maximum (${mVolPct()}%)` : "Volume is already muted (0%)")
            : next === 0 ? "Turning the volume down to 0% — muted"
              : `Turning the volume ${up ? "up" : "down"} to ${Math.round(next * 100)}%`;
          if (!mLoaded) msg += " — say “play music” to start a song";
        }
        if (r.intent === "WEATHER") {
          if (wx) {
            msg = `${esc(wx.place)}: ${wx.desc}, ${wx.temp}°C — feels like ${wx.feels}°, high ${wx.hi}° low ${wx.lo}°`;
            holdMs = 5200;                       // weather line is longer; give it time to read
          } else {
            msg = "Checking the weather…";       // first fetch still in flight
            holdMs = 2600;
            fetchWeather();
          }
        }
        if (r.intent === "CREATE_REMINDER") {
          const task = addReminder(r.slot);        // add + swing the chip's bell
          msg = `Reminder set: ${task}`;
          holdMs = 3600;
        }
        if (r.intent === "LIST_REMINDERS") {
          if (reminders.length) {
            const n = reminders.length;
            msg = n === 1 ? "1 reminder" : `${n} reminders`;
            // first two tasks inline, rest implied by the panel
            const first = reminders.map(x => x.task).slice(0, 2).join(", ");
            msg += ` — ${first}${reminders.length > 2 ? " and more" : ""}`;
            holdMs = 5200;                       // panel is open; give it time to read
          } else {
            msg = "No reminders yet";
            holdMs = 3000;
          }
          showRemPanel(holdMs);                  // pull the saved list from storage
        }
        msg = msg.replace("{slot}", (r.slot && r.slot !== "NO_SLOT") ? r.slot : "");
        const tag = r.slot && r.slot !== "NO_SLOT" ? `<span class="tag">${esc(r.intent)} · ${esc(r.slot)}</span>`
          : `<span class="tag">${esc(r.intent)}</span>`;
        detail = `${msg} ${tag}`;
        // STOP's owner (timer, aircon, call, ...) shows its own line; just confirm
        if (r.intent !== "STOP") spoken = `${confirm}. ${msg}`;
      }
      setPhrase(confirm, "confirm");
      if (detail) detailEl.innerHTML = detail, detailEl.classList.add("show");
      speak(spoken);
      hintEl.textContent = "";

      // ---- timer: the ring owns the timing from here on ----
      if (r && r.intent === "TIMER") {
        dismissCall();
        dismissAlarm();
        dismissMessage();                            // a new command supersedes the call
        const secs = slotToSeconds(r.slot);
        startTimer(secs, r.slot, { demo: DEMO });
        return;                       // skip the generic idle-reset
      }
      // ---- temperature: the aircon owns the timing from here on ----
      if (r && r.intent === "TEMPERATURE") {
        dismissCall();
        dismissAlarm();
        dismissMessage();
        const dm = String(r.slot || "").match(/\d+/);
        acSetTarget(dm ? parseInt(dm[0], 10) : 22, r.slot);   // [0]: /\d+/ has no capture group
        return;                       // skip the generic idle-reset
      }
      // ---- color: the object scene owns the timing from here on ----
      if (r && r.intent === "COLOR") {
        dismissCall();
        dismissAlarm();
        dismissMessage();
        setTheme(String(r.slot || "").toLowerCase().trim());
      }
      // ---- lights on / off: the whole UI turns light / dark ----
      if (r && (r.intent === "LIGHT_ON" || r.intent === "LIGHT_OFF")) {
        dismissCall();
        dismissAlarm();
        dismissMessage();
        dismissLamp();                               // a BRIGHTNESS lamp may still be up
        setMode(r.intent === "LIGHT_ON");
      }
      // ---- brightness: the lamp owns the timing from here on ----
      if (r && r.intent === "BRIGHTNESS") {
        dismissCall();
        dismissAlarm();
        dismissMessage();
        const bm = String(r.slot || "").match(/\d+/);   // [0]: /\d+/ has no capture group
        lampSetLevel(bm ? parseInt(bm[0], 10) : 60, r.slot);
        return;                       // skip the generic idle-reset
      }
      // ---- call: the phone owns the timing from here on ----
      if (r && r.intent === "CALL") {
        dismissCall();
        dismissAlarm();
        dismissMessage();                            // re-dial: restart the sequence cleanly
        startCall(DEMO);
        return;                       // skip the generic idle-reset
      }
      // ---- alarm: the clock owns the timing from here on ----
      if (r && r.intent === "ALARM") {
        dismissCall();
        dismissAlarm();                           // re-arm: restart the sequence cleanly
        if (!DEMO) scheduleAlarm(r.slot);         // the real, wall-clock alarm
        alarmStart(r.slot, DEMO);
        return;                       // skip the generic idle-reset
      }
      // ---- message: the bubble owns the timing from here on ----
      if (r && r.intent === "MESSAGE") {
        dismissCall();
        dismissAlarm();
        dismissMessage();                        // re-send: restart the sequence cleanly
        startMessage(DEMO);
        return;                       // skip the generic idle-reset
      }
      // ---- "pause" while the alarm rings = snooze (there's no snooze command) ----
      if (r && r.intent === "PAUSE" && alarmActive && alarmPhase === "ringing") {
        detailEl.innerHTML = `Snoozed <span class="tag">ALARM · ${esc(alarmLabel)}</span>`;
        alarmSnooze();
        return;
      }
      // ---- music intents: the player owns its own UI ----
      if (r && ["PLAY_MUSIC", "PAUSE", "NEXT", "VOLUME_UP", "VOLUME_DOWN"].includes(r.intent)) {
        dismissCall();
        dismissAlarm();
        dismissMessage();
        handleMusic(r.intent);
      }
      // ---- stop: music first, then the timer (running OR still dismissing),
      //      then the aircon, then the phone, then a generic stop. Each owner
      //      shows its own confirmation and schedules its own fade, so the
      //      generic "Stopped playback" line is suppressed when something
      //      was actually stopped. ----
      if (r && r.intent === "STOP") {
        if (alarmActive && alarmPhase === "ringing") { alarmOff(); return; }
        if (mLoaded) { handleMusic("STOP"); holdMs = 2200; }
        else if (timerActive) { stopTimer("stopped"); return; }
        else if (timerWasDismissal) {                         // "time's up" window — treat as timer stop
          detailEl.innerHTML = `<span class="tag">TIMER \u00b7 ${esc(timerLabel)}</span>`;
          finishTimer(700); return;
        }
        else if (acActive) { finishAc(500); return; }
        else if (lampActive) { finishLamp(500); return; }
        else if (callActive) { hangUp(); return; }
        else if (alarmActive) { alarmOff(); return; }
        else if (msgActive) { msgCloseOut(); return; }
      }
      // generic hold, then fade back to idle
      resultTimer = setTimeout(() => {
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        state = "idle";
        hintEl.textContent = "say “hey alexa” to begin";
      }, holdMs);
    }

    function onRejected(msg) {
      state = "result";
      mDuck(false);
      setPhrase("Hmm?", "wake");
      speak(msg || "I didn’t catch that");
      detailEl.innerHTML = msg ? `<span style="color:var(--muted)">${esc(msg)}</span>` : "I didn’t catch that";
      detailEl.classList.add("show");
      resultTimer = setTimeout(() => {
        phraseEl.classList.remove("show"); detailEl.classList.remove("show");
        document.body.classList.remove("busy"); state = "idle";
        hintEl.textContent = "say “hey alexa” to begin";
      }, 2600);
    }

    /* =====================================================================
       TIMER  — circular depleting ring, live countdown, voice/tap stop, chime
       Driven by the TIMER intent (10s / 30s / 1m). The ring is painted inside
       the main draw() loop (no second rAF). Completion / stop own the reset.
       ===================================================================== */
    let timerActive = false, timerTotal = 0, timerEnd = 0, timerLabel = "", timerDone = false;
    let timerShownSec = -1;
    const RING_C = 552.92;   // 2*pi*88, matches the SVG stroke-dasharray

    const timerEl = el("timer"), ringFill = el("ringFill"),
      ringTime = el("ringTime"), ringSub = el("ringSub"), timerStopBtn = el("timerStop");

    function fmtTime(sec) {
      sec = Math.max(0, Math.ceil(sec));
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + ":" + String(s).padStart(2, "0");
    }
    function slotToSeconds(slot) {
      if (!slot) return 0;
      const m = String(slot).match(/(\d+)\s*(minutes?|mins?|seconds?|secs?|s|m)/i);
      if (!m) return 0;
      const n = parseInt(m[1], 10), u = m[2].toLowerCase();
      return u.startsWith("m") ? n * 60 : n;
    }
    function chime(kind) {
      if (!actx) return;                       // no audio context in demo mode
      const t0 = actx.currentTime;
      const notes = kind === "done" ? [880, 1174.66, 1567.98] : [659.25, 493.88];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const s = t0 + i * 0.14;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.18, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
        o.connect(g).connect(actx.destination);
        o.start(s); o.stop(s + 0.55);
      });
    }
    function startTimer(seconds, label, opts = {}) {
      if (seconds <= 0) seconds = 30;
      if (opts.demo) seconds = Math.min(seconds, 3);   // keep the preview snappy
      timerActive = true; timerDone = false;
      timerTotal = seconds * 1000;
      timerEnd = performance.now() + timerTotal;
      timerLabel = label || fmtTime(seconds);
      timerShownSec = -1;
      ringTime.textContent = fmtTime(seconds);
      ringSub.textContent = "timer";
      timerStopBtn.textContent = "tap to stop";
      timerEl.classList.remove("done", "urgent");
      timerEl.classList.add("show");
      document.body.classList.add("timer-active", "busy");
    }
    function stopTimer(kind) {                    // kind: "stopped" | "done"
      if (!timerActive) return;
      timerActive = false; timerDone = true;
      const remainSec = Math.max(0, (timerEnd - performance.now()) / 1000);
      ringFill.style.strokeDashoffset = RING_C;    // fully depleted
      ringTime.textContent = kind === "done" ? "0:00" : fmtTime(remainSec);
      ringSub.textContent = kind === "done" ? "time's up" : "stopped";
      timerEl.classList.remove("urgent");
      timerEl.classList.add("done");
      timerStopBtn.textContent = kind === "done" ? "" : "tap to dismiss";
      chime(kind);
      setPhrase(kind === "done" ? rand(["Time's up!", "All done", "That's time", "Timer's done"])
        : rand(["Stopped", "Okay, stopped", "Cancelled", "Timer stopped"]), "confirm");
      detailEl.innerHTML = `<span class="tag">TIMER · ${esc(timerLabel)}</span>`;
      detailEl.classList.add("show");
      finishTimer(kind === "done" ? 2600 : 1800);
    }
    function finishTimer(holdMs) {
      clearTimeout(resultTimer);
      resultTimer = setTimeout(() => {
        timerDone = false;                          // dismissal finished — no ring left to dismiss
        timerEl.classList.remove("show", "done", "urgent");
        document.body.classList.remove("timer-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        state = "idle";
        hintEl.textContent = "say “hey alexa” to begin";
      }, holdMs);
    }
    // called from the main draw() loop each frame while a timer runs
    function tickTimer() {
      if (!timerActive) return;
      const remainMs = timerEnd - performance.now();
      if (remainMs <= 0) { stopTimer("done"); return; }
      const frac = remainMs / timerTotal;            // 1 -> 0
      ringFill.style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(2);
      const remSec = remainMs / 1000, shown = Math.ceil(remSec);
      if (shown !== timerShownSec) { timerShownSec = shown; ringTime.textContent = fmtTime(shown); }
      timerEl.classList.toggle("urgent", remSec <= 3.05);
    }
    timerStopBtn.addEventListener("click", e => {
      e.stopPropagation();
      if (timerActive) stopTimer("stopped");
      else if (timerDone) finishTimer(400);       // tap to dismiss after done
    });

    /* =====================================================================
       AIRCON  — wall unit that cools/heats to the TEMPERATURE slot (18/22/26 °C)
       The number tweens from the previous setting to the target; the fan spins
       faster the colder the target; cold-air streaks fall from the louver while
       "cooling" (target < 22) and warm streaks rise while "heating" (> 22);
       at 22 the unit idles with a slow fan. The unit owns the hold time, then
       fades back to idle — same contract as the timer ring.
       ===================================================================== */
    const acEl = el("ac"), acTempEl = el("acTemp"), acModeEl = el("acMode"),
      acAirEl = el("acAir"), acSubEl = el("acSub");
    let acActive = false, acFinishing = false, acFrom = 22, acTarget = 22, acTweenT0 = 0, AC_TWEEN_MS = 1100;
    let acCoolingUntil = 0, acFinishAt = 0, acStreakTimer = null;
    const AC_HOLD_MS = 3400;   // how long the aircon stays on screen before it fades (ms)
    const AC_FADE_MS = 1400;   // fade-out duration (ms)

    function acSetTarget(deg, label) {
      if (!deg) deg = 22;
      acFrom = parseFloat(acTempEl.textContent) || 22;
      acTarget = deg;
      acTempEl.textContent = acFrom;
      acModeEl.textContent = deg < 22 ? "cool" : deg > 22 ? "heat" : "eco";
      acSubEl.textContent = deg === 22 ? "holding at 22°"
        : deg < 22 ? `cooling to ${deg}°`
          : `heating to ${deg}°`;
      // fan speed: colder target -> faster spin (0.35 s at 18°, 1.4 s at 26°)
      acEl.style.setProperty("--fanDur", (deg < 22 ? 0.35 + (deg - 18) * 0.25 : 1.15 + (26 - deg) * 0.25) + "s");
      acActive = true;
      acFinishing = false;
      clearTimeout(resultTimer);   // cancel any in-flight fade from a previous command
      acTweenT0 = performance.now();
      // air flows for 3.2 s while the temp is moving; 22° idles 2.6 s with no air
      acCoolingUntil = performance.now() + (deg === 22 ? 0 : 3200);
      acFinishAt = performance.now() + AC_HOLD_MS;
      acEl.classList.remove("cooling");
      acEl.classList.add("show");
      document.body.classList.add("ac-active", "busy");
      if (deg !== 22) acSpawnStreaks();
    }
    function acSpawnStreaks() {
      clearInterval(acStreakTimer);
      const warm = acTarget > 22;
      acStreakTimer = setInterval(() => {
        if (!acActive) return;
        const n = 1 + (Math.random() < .5 ? 1 : 0);
        for (let i = 0; i < n; i++) {
          const s = document.createElement("span");
          s.className = "air";
          const w = 2 + Math.random() * 3;
          s.style.left = (8 + Math.random() * 84) + "%";
          s.style.width = w + "px";
          s.style.height = (26 + Math.random() * 46) + "px";
          s.style.animationDuration = (1.1 + Math.random() * 0.9) + "s";
          s.style.setProperty("--sway", (warm ? (Math.random() * 30 - 15) : (Math.random() * 30 - 15)).toFixed(0) + "px");
          s.style.setProperty("--airO", (warm ? 0.5 : 0.75).toFixed(2));
          if (warm) {  // heat: streaks rise from the air zone
            s.style.top = "auto"; s.style.bottom = "-34px";
            s.style.background = "linear-gradient(0deg, rgba(var(--accent-rgb), .9), rgba(var(--accent-hi-rgb), .35) 55%, transparent)";
            s.style.animationName = "airRise";
          }
          acAirEl.appendChild(s);
          s.addEventListener("animationend", () => s.remove());
        }
      }, 160);
    }
    function tickAc() {
      if (!acActive || acFinishing) return;
      const t = Math.min(1, (performance.now() - acTweenT0) / AC_TWEEN_MS);
      const e = 1 - Math.pow(1 - t, 3);                          // easeOutCubic
      acTempEl.textContent = Math.round(acFrom + (acTarget - acFrom) * e);
      const cooling = performance.now() < acCoolingUntil && acTarget !== 22;
      acEl.classList.toggle("cooling", !!cooling);
      if (performance.now() >= acFinishAt) finishAc(AC_FADE_MS);   // one-shot: guard above stops re-arming
    }
    function finishAc(holdMs) {
      if (acFinishing) return;                             // tickAc fires every frame — arm the fade only once
      acFinishing = true;
      clearTimeout(resultTimer);
      clearInterval(acStreakTimer);
      resultTimer = setTimeout(() => {
        acEl.classList.remove("show", "cooling");
        acAirEl.innerHTML = "";
        document.body.classList.remove("ac-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        acActive = false; acFinishing = false;
        state = "idle";
        hintEl.textContent = "say “hey alexa” to begin";
      }, holdMs);
    }
    // heat streaks rise (paired with airFall's fall)
    const acStyle = document.createElement("style");
    acStyle.textContent = "@keyframes airRise{ 0%{ transform:translate(0,10px) scaleY(.5); opacity:0; } 14%{ opacity:var(--airO,.5); } 100%{ transform:translate(var(--sway,10px),-210px) scaleY(1.3); opacity:0; } }";
    document.head.appendChild(acStyle);

    /* =====================================================================
       THEME  — COLOR intent: "red" / "green" / "blue" retint the whole UI
       Tweens every theme variable in :root (the 7 shades + rgb triplets the
       CSS uses), so cards, glows, the wave and the buttons all shift
       together, while a sweep of the new color washes out from the center.
       The theme stays until another color is chosen (reload -> pink).
       ===================================================================== */
    const THEMES = {
      pink: { 100: "#ffe1ef", 200: "#ffc2e0", 300: "#ff9ecb", 400: "#ff6fb5", 500: "#ff3d9e", 600: "#f0128a", 700: "#c4006e" },
      red: { 100: "#ffe1e3", 200: "#ffc2c7", 300: "#ff9ea6", 400: "#ff6f7c", 500: "#ff3d50", 600: "#f01231", 700: "#c40021" },
      green: { 100: "#dcfce9", 200: "#b9f7d3", 300: "#8cefb7", 400: "#5ce397", 500: "#2fd67b", 600: "#12b862", 700: "#00924c" },
      blue: { 100: "#e1edff", 200: "#c2dbff", 300: "#9ec5ff", 400: "#6fa8ff", 500: "#3d8bff", 600: "#126cf0", 700: "#0052c4" },
    };
    const SHADES = [100, 200, 300, 400, 500, 600, 700];
    const THEME_TWEEN_MS = 900;
    const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgbA = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
    const paletteRgb = name => Object.fromEntries(SHADES.map(k => [k, hexRgb(THEMES[name][k])]));

    // Light / dark mode (LIGHT_ON / LIGHT_OFF). `mode` runs 0 (dark) .. 1
    // (light) and is tweened like the palette. In light mode the pale accent
    // shades used for text (200 / 300) take deeper tones so they stay
    // readable on white; glows keep the bright palette.
    const MODES = {
      dark: { bg: "#050506", bgSoft: "#0b0b0e", text: "#f6f6f8", muted: "#8b8b93", surface: "#09090b", line: "#ffffff" },
      light: { bg: "#f3f3f6", bgSoft: "#ffffff", text: "#16161b", muted: "#6b6b75", surface: "#ffffff", line: "#000000" },
    };
    const MODE_TWEEN_MS = 1100;
    const mixRgb = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
    const modeRgb = Object.fromEntries(Object.entries(MODES).map(([n, m]) =>
      [n, Object.fromEntries(Object.entries(m).map(([k, h]) => [k, hexRgb(h)]))]));
    let mode = 0, modeTween = null;

    let themeName = "pink";

    function paintTheme() {

      root.setProperty("--accent-hi-rgb", theme[300].map(v => v | 0).join(", "));

      const from = theme, to = paletteRgb(name), t0 = performance.now();
      themeTween = { from, to, t0 };
      // sweep in the new color, restarted even if the same color is asked twice
      document.documentElement.style.setProperty("--sweep-rgb", to[500].join(", "));
      sweepEl.classList.remove("go"); void sweepEl.offsetWidth; sweepEl.classList.add("go");
    }
    // LIGHT_ON -> light mode, LIGHT_OFF -> dark mode: light (or darkness)
    // spreads from the center while every surface and text color blends over.
    function setMode(light) {
      const target = light ? 1 : 0;
      modeTween = { from: mode, to: target, t0: performance.now() };
      document.documentElement.style.setProperty("--sweep-rgb", light ? "255, 255, 255" : "0, 0, 0");
      sweepEl.classList.remove("go"); void sweepEl.offsetWidth; sweepEl.classList.add("go");

        const e = 1 - Math.pow(1 - k, 3);               // ease-out cubic

      }
      if (modeTween) {

    /* =====================================================================
       LAMP  — pendant light for BRIGHTNESS (LIGHT_ON / LIGHT_OFF switch
       the whole UI between light and dark mode instead — see setMode)
       Owns the UI the same way the timer ring and aircon do: it takes over
       the stage, tweens the level, then fades back to the idle wave.
       The glow is driven by a --lum custom property (0..1) set each frame.
       ===================================================================== */
    const lampEl = el("lamp"), lampPctEl = el("lampPct"), lampModeEl = el("lampMode"),
      lampSubEl = el("lampSub"), lampRaysEl = el("lampRays");
    let lampActive = false, lampFinishing = false, lampFrom = 0, lampTarget = 0, lampTweenT0 = 0, LAMP_TWEEN_MS = 1200;
    let lampFinishAt = 0, lampRayTimer = null;

    function lampSetLevel(pct, label) {

      lampTarget = pct;
      lampPctEl.textContent = lampFrom;
      lampModeEl.textContent = pct === 0 ? "off" : pct < 40 ? "dim" : pct < 80 ? "bright" : "full";
      lampSubEl.textContent = pct === 0 ? "lights off" : `setting to ${pct}%`;
      lampActive = true;
      lampFinishing = false;
      clearTimeout(resultTimer);   // cancel any in-flight fade from a previous command
      lampTweenT0 = performance.now();
      lampFinishAt = performance.now() + LAMP_HOLD_MS;
      lampEl.classList.remove("igniting");
      lampEl.classList.add("show");

    function lampSpawnRays() {
      clearInterval(lampRayTimer);

        if (!lampActive || lampTarget === 0) return;
        const n = 1 + (Math.random() < .5 ? 1 : 0);
        for (let i = 0; i < n; i++) {
          const s = document.createElement("span");
          s.className = "ray";
          const w = 2 + Math.random() * 3;
          s.style.left = (12 + Math.random() * 76) + "%";
          s.style.width = w + "px"; s.style.height = w + "px";
          s.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
          s.style.setProperty("--sx", (Math.random() * 60 - 30).toFixed(0) + "px");
          s.style.setProperty("--ro", (0.35 + Math.random() * 0.4).toFixed(2));

      const e = 1 - Math.pow(1 - t, 3);                          // easeOutCubic
      const cur = Math.round(lampFrom + (lampTarget - lampFrom) * e);
      lampPctEl.textContent = cur;
      // perceived brightness follows gamma so 20% looks dim, not half-lit
      lampEl.style.setProperty("--lum", Math.pow(cur / 100, 2.2).toFixed(3));
      if (t < 1) lampEl.classList.add("igniting");

    }
    // Take the lamp down immediately (no fade, no idle reset) when another
    // command takes over the stage.
    function dismissLamp() {
      if (!lampActive) return;
      clearInterval(lampRayTimer);
      lampEl.classList.remove("show", "igniting");
      lampRaysEl.innerHTML = "";
      lampEl.style.setProperty("--lum", 0);
      document.body.classList.remove("lamp-active");
      lampActive = false; lampFinishing = false;
    }
    function finishLamp(holdMs) {
      if (lampFinishing) return;                           // tickLamp fires every frame — arm the fade only once
      lampFinishing = true;
      clearTimeout(resultTimer);
      clearInterval(lampRayTimer);
      resultTimer = setTimeout(() => {
        lampEl.classList.remove("show", "igniting");
        lampRaysEl.innerHTML = "";
        lampEl.style.setProperty("--lum", 0);
        document.body.classList.remove("lamp-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        lampActive = false; lampFinishing = false;
        state = "idle";
        hintEl.textContent = "say “hey alexa” to begin";
      }, holdMs);
    }

    /* =====================================================================
       PHONE  — dialing screen for the CALL intent ("call" / "make a call")
       Phases: dialing (sonar rings, "calling…") -> connected (live timer,
       equalizer dancing, ring tones) -> hangup (flash + fade back to idle).
       The screen owns its hold time, same contract as the timer ring and
       the aircon. Voice "stop" hangs up early; the red button does too.
       ===================================================================== */
    const callEl = el("call"), callNameEl = el("callName"), callStatusEl = el("callStatus"),
      callTimerEl = el("callTimer"), callHangBtn = el("callHang");
    let callActive = false, callPhase = "";            // "" | "dialing" | "connected"
    let callConnectAt = 0, callShownSec = -1, callFinishAt = 0, callFinishHold = 1200;

    const CALL_NAMES = ["Home", "Office", "Mom", "Dad", "Work"];
    const CALL_DIALING = ["calling…", "dialing…", "ringing…"];
    const CALL_CONNECTED = ["connected", "in a call", "on the line"];
    const CALL_BYE = ["Bye", "Talk soon", "All done", "See you later"];

    function startCall(demo) {
      callActive = true; callPhase = "dialing";
      callNameEl.textContent = rand(CALL_NAMES);
      callStatusEl.textContent = rand(CALL_DIALING);
      callTimerEl.textContent = "0:00"; callShownSec = -1;
      callEl.classList.remove("connected", "bye");
      callEl.classList.add("show");
      document.body.classList.add("call-active", "busy");
      const dialMs = demo ? 1200 : 2200 + Math.random() * 1200;
      callConnectAt = performance.now() + dialMs;
      // a real call would run until stopped; here it auto-hangs up so the
      // screen always returns to idle on its own (snappier in demo mode)
      callFinishAt = performance.now() + (demo ? 5500 : 20000);
      ringTone("dial");
    }
    function tickCall() {
      if (!callActive) return;
      const now = performance.now();
      if (callPhase === "dialing" && now >= callConnectAt) {
        callPhase = "connected";
        callEl.classList.add("connected");
        callStatusEl.textContent = rand(CALL_CONNECTED);
        ringTone("connect");
      }
      if (callPhase === "connected") {
        const sec = Math.max(0, Math.floor((now - callConnectAt) / 1000));
        if (sec !== callShownSec) { callShownSec = sec; callTimerEl.textContent = fmtTime(sec); }
      }
      if (now >= callFinishAt) hangUp();              // natural end of the call
    }
    function hangUp() {
      if (!callActive) return;
      callActive = false; callPhase = "";
      stopRingTone();
      callEl.classList.add("bye");
      callStatusEl.textContent = "ended";
      callEl.classList.remove("connected");
      setPhrase(rand(CALL_BYE), "confirm");
      detailEl.innerHTML = `<span class="tag">CALL \u00b7 ${esc(callNameEl.textContent)}</span>`;
      detailEl.classList.add("show");
      ringTone("hang");
      finishCall(1400);
    }
    /* silent, instant teardown — used when another command supersedes the call
       (timer / aircon / music / a new call). No bye phrase, no fade hold. */
    function dismissCall() {
      if (!callActive) return;
      callActive = false; callPhase = "";
      stopRingTone();
      callEl.classList.remove("show", "connected", "bye");
      document.body.classList.remove("call-active");
    }
    function finishCall(holdMs) {
      clearTimeout(resultTimer);
      resultTimer = setTimeout(() => {
        callEl.classList.remove("show", "connected", "bye");
        document.body.classList.remove("call-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        state = "idle";
        hintEl.textContent = "say \u201chey alexa\u201d to begin";
      }, holdMs);
    }
    /* ring tones — classic US cadence: 2 s on / 4 s off, dual 350+440 Hz */
    let callToneTimer = null, callToneOn = null, callToneNodes = [];
    function ringTone(kind) {
      if (!actx) return;                            // no audio context in demo mode

      const mk = (f, g0, dur) => {
        const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(g0, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(actx.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
        callToneNodes.push(o);

      if (kind === "hang") { mk(440, 0.12, 0.35); mk(350, 0.12, 0.35); return; }

        [350, 440].forEach(f => {
          const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
          o.type = "sine"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(0.09, t0 + 0.03);
          g.gain.setValueAtTime(0.09, t0 + 1.9);
          g.gain.linearRampToValueAtTime(0.0001, t0 + 2.0);
          o.connect(g).connect(actx.destination);
          o.start(t0); o.stop(t0 + 2.05);
          callToneNodes.push(o);
        });
      };
      if (kind === "connect") { burst(); return; }      // one short "pickup" chirp
      burst();                                      // dialing: repeat 2 s on / 4 s off
      callToneOn = setTimeout(() => { callToneOn = setTimeout(stopRingTone, 4000); }, 2000);
      callToneTimer = setInterval(() => {
        if (!callActive) return stopRingTone();

      }, 6000);

      e.stopPropagation();
      if (callActive) hangUp();
      else finishCall(300);                        // tap to dismiss after bye
    });

    /* =====================================================================
       ALARM  — twin-bell clock for the ALARM intent ("alarm at 6 AM")
       Phases: set (quiet, hands sweep to the set time) -> ringing (clock
       shakes, bells + hammer strike, sound waves, twin-bell tone) ->
       snoozed (dozes, "z z z") or off (shaking settles out, fade to idle).
       Same scene contract as the call: owns the hold, one-shot fade,
       voice "stop" ends it early, the ✕ button does too, snooze restarts
       the ring after a short nap.

       Real alarms (everything except ?demo): ALARM schedules a one-shot
       alarm for the NEXT occurrence of the time — today if it's still
       ahead, else tomorrow — and the clock only confirms it. Alarms are
       saved in localStorage (a reload keeps them) and checked every second
       against the wall clock, so a throttled background tab or a laptop
       waking from sleep rings as soon as it runs again. The browser rings,
       not the Pi, so the page has to stay open. Ringing lasts up to 10 min;
       snooze ("snooze" button or "Alexa, pause") is 9 min; "Alexa, stop"
       or ✕ turns it off. Pills in the top-left list pending alarms; tap one
       to cancel it.
       ===================================================================== */
    const alarmEl = el("alarm"), alarmTimeEl = el("alarmTime"), alarmSubEl = el("alarmSub"),
      alarmHandH = el("alarmHandH"), alarmHandM = el("alarmHandM"),
      alarmSnoozeBtn = el("alarmSnooze"), alarmStopBtn = el("alarmStop");
    let alarmActive = false, alarmFinishing = false, alarmPhase = "";   // ""|"set"|"ringing"|"snoozed"|"off"
    let alarmLabel = "", alarmHandsT0 = 0, alarmRingAt = 0, alarmFinishAt = 0, alarmSnoozeUntil = 0;
    const ALARM_SET_MS = 1500, ALARM_SNOOZE_MS = 2600, ALARM_FADE_MS = 1400;
    const ALARM_HOLD_MS = 5200, ALARM_HOLD_DEMO_MS = 6800;
    const ALARM_SET_SHOW_MS = 3600;                   // "alarm set" confirmation on screen
    const ALARM_RING_MAX_MS = 10 * 60 * 1000;         // like a phone: rings 10 min, then gives up
    const ALARM_SNOOZE_REAL_MS = 9 * 60 * 1000;       // the classic 9-minute snooze
    const ALARM_LATE_OK_MS = 10 * 60 * 1000;          // missed by more (page closed) -> dropped
    const ALARMS_KEY = "tiny-alexa.alarms.v1";
    const alarmChipEl = el("alarmChip");
    let alarms = [];                                  // [{at: epoch ms, label: "6:00 AM", snoozed}]
    try {
      alarms = (JSON.parse(localStorage.getItem(ALARMS_KEY)) || [])
        .filter(a => a && Number.isFinite(a.at) && typeof a.label === "string");
    } catch (e) { alarms = []; }

    function parseAlarmTime(slot) {
      // "6 AM" / "6:30 pm" / "7" -> {h,m,ampm,label} ; falls back to 6:00 AM
      const s = String(slot || "").toUpperCase();
      const m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/);
      let h = 6, mi = 0, ampm = "AM";
      if (m) {
        h = parseInt(m[1], 10); mi = m[2] ? parseInt(m[2], 10) : 0;
        if (m[3]) ampm = m[3];

        if (ampm === "AM" && h === 12) h = 0;

    }
    function alarmSetHands(t) {
      // hands sweep from 12:00 to the set time (CSS transition does the easing)
      alarmHandH.style.transform = `rotate(${t.h * 30 + t.m * 0.5}deg)`;
      alarmHandM.style.transform = `rotate(${t.m * 6}deg)`;
    }
    function saveAlarms() {

    }
    function nextOccurrence(t, from = new Date()) {
      const d = new Date(from);

      return d.getTime();
    }

    function alarmPreview(slot) {

      return { t, at: same ? same.at : nextOccurrence(t), exists: !!same };
    }

      renderAlarmChip();
      return p;
    }
    function cancelAlarm(a, quiet) {

      saveAlarms();
      renderAlarmChip();
      if (!quiet) toast(`Alarm ${a.label} cancelled`, 1800);
    }
    function renderAlarmChip() {
      alarms.sort((a, b) => a.at - b.at);
      alarmChipEl.replaceChildren(...alarms.map(a => {
        const b = document.createElement("button");   // DOM, not innerHTML, for the click handler
        b.className = "apill";
        b.innerHTML = `<span>⏰</span><span>${esc(a.label)}</span>`
          + (a.snoozed ? `<span class="asn">snoozed · ${esc(fmtClock(a.at))}</span>` : "")
          + `<span class="ax">✕</span>`;
        const tip = () => { b.title = `rings in ${fmtIn(a.at - Date.now())} — tap to cancel`; };
        tip();
        b.addEventListener("mouseenter", tip);
        b.addEventListener("click", e => { e.stopPropagation(); cancelAlarm(a); });
        return b;
      }));

    }
    function checkAlarms() {

      const due = alarms.filter(a => a.at <= now);
      if (!due.length) return;
      alarms = alarms.filter(a => a.at > now);         // one-shot: a rung alarm is done
      saveAlarms();
      renderAlarmChip();
      due.filter(a => now - a.at > ALARM_LATE_OK_MS)
        .forEach(a => toast(`Missed alarm ${a.label} — the page wasn't open`, 4000));
      const ring = due.filter(a => now - a.at <= ALARM_LATE_OK_MS).pop();
      if (ring) alarmRing(ring.label);
    }
    function alarmRing(label) {
      // the alarm takes the stage from any other scene
      dismissCall(); dismissMessage(); dismissAlarm();
      alarmLabel = label;
      alarmTimeEl.textContent = label;
      alarmSubEl.textContent = `ringing — ${label}`;
      alarmActive = true; alarmFinishing = false; alarmPhase = "ringing";
      clearTimeout(resultTimer);
      alarmEl.classList.remove("show", "ringing", "snoozed", "off");
      void alarmEl.offsetWidth;
      alarmSetHands(parseAlarmTime(label));

      document.body.classList.add("alarm-active", "busy");

      alarmTone("ring");
    }

    function alarmStart(slot, demo) {
      const t = parseAlarmTime(slot);
      alarmLabel = t.label;
      alarmTimeEl.textContent = alarmLabel;
      alarmSubEl.textContent = demo ? `alarm set for ${alarmLabel}`
        : `rings in ${fmtIn(alarmPreview(slot).at - Date.now())}`;
      alarmActive = true; alarmFinishing = false; alarmPhase = "set";
      clearTimeout(resultTimer);                    // cancel any in-flight fade
      alarmEl.classList.remove("show", "ringing", "snoozed", "off");
      void alarmEl.offsetWidth;                     // restart the sweep transition
      alarmHandH.style.transform = "rotate(0deg)";
      alarmHandM.style.transform = "rotate(0deg)";
      alarmEl.classList.add("show");
      document.body.classList.add("alarm-active", "busy");
      alarmHandsT0 = performance.now();
      alarmRingAt = performance.now() + ALARM_SET_MS;
      alarmFinishAt = performance.now() + (demo ? ALARM_HOLD_DEMO_MS : ALARM_HOLD_MS);
      requestAnimationFrame(() => requestAnimationFrame(() => alarmSetHands(t)));

      const now = performance.now();
      if (alarmPhase === "set" && now >= alarmRingAt) {
        alarmPhase = "ringing";
        alarmEl.classList.add("ringing");
        alarmSubEl.textContent = `ringing — ${alarmLabel}`;
        alarmTone("ring");

      if (alarmPhase === "snoozed" && now >= alarmSnoozeUntil) alarmWake();
      if ((alarmPhase === "ringing" || alarmPhase === "snoozed") && now >= alarmFinishAt)
        alarmOff();                                 // natural end — one-shot: phase flips to "off"
    }
    function alarmWake() {                            // snooze is up: ring again
      alarmPhase = "ringing";
      alarmEl.classList.remove("snoozed");
      alarmEl.classList.add("ringing");
      alarmSubEl.textContent = `ringing — ${alarmLabel}`;
      alarmFinishAt = performance.now() + (DEMO ? ALARM_HOLD_DEMO_MS : ALARM_HOLD_MS);
      alarmTone("ring");
    }
    function alarmSnooze() {
      if (!alarmActive || alarmPhase !== "ringing") return;
      alarmPhase = "snoozed";
      alarmEl.classList.remove("ringing");
      alarmEl.classList.add("snoozed");
      alarmSubEl.textContent = `snoozed — ${alarmLabel}`;
      if (!DEMO) {                                     // real snooze: ring again in 9 min
        const at = Date.now() + ALARM_SNOOZE_REAL_MS;
        alarms.push({ at, label: alarmLabel, snoozed: true });
        saveAlarms();
        renderAlarmChip();

        stopAlarmTone();
        alarmEl.classList.remove("show", "ringing", "snoozed", "off");
        document.body.classList.remove("alarm-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");

    /* twin-bell tone — two detuned metallic partials, pulsing like a real bell */
    let alarmToneTimer = null, alarmToneNodes = [];

    /* =====================================================================

      "Don’t forget to buy milk!",
      "On my way — see you soon",
      "See you at 7, don’t be late!",
      "That sounds great, count me in",
      "Can you pick up groceries?",
      "Love you! Talk later ❤"

      msgStatusEl.textContent = "typing…";

      detailEl.innerHTML = `<span class="tag">MESSAGE \u00b7 ${esc(msgToEl.textContent.replace(/^to /, ""))}</span>`;
      detailEl.classList.add("show");

    /* silent, instant teardown — used when another command supersedes the message */

      document.body.classList.remove("msg-active");

    function finishMessage(holdMs) {
      clearTimeout(resultTimer);
      resultTimer = setTimeout(() => {
        msgEl.classList.remove("show", "sent");
        document.body.classList.remove("msg-active");
        phraseEl.classList.remove("show");
        detailEl.classList.remove("show");
        document.body.classList.remove("busy");
        msgActive = false; msgPhase = "";
        state = "idle";
        hintEl.textContent = "say \u201chey alexa\u201d to begin";

    /* message tones — soft ticks and a rising send swoop, all synthesized */
    let msgToneNodes = [];
    function msgTone(kind) {

      if (kind === "type") beep(660, .06, .04);
      if (kind === "key")  beep(440 + Math.random() * 220, .045, .025);
      if (kind === "send") { beep(523.25, .12, .06); beep(659.25, .12, .06, .09); beep(783.99, .2, .07, .18, "sine", 1046.5); }

    /* =====================================================================
       MUSIC  — local MP3 player (data/music/ folder, served by server.py at /music)
       Track list + ID3 metadata + album art come from GET /music.
       The audio itself plays in the browser's <audio> element, so the Pi's
       CPU only serves small static files — zero decoding cost.
       PLAY_MUSIC  -> start the playlist (or resume)
       PAUSE       -> pause / resume (toggle)
       STOP        -> stop and hide the card
       NEXT        -> next track (PREV = previous)

    /* --- Autoplay unlock ----------------------------------------------------

       has been started inside a REAL user gesture. Our play() calls arrive from
       WebSocket messages seconds after the tap, so we prime the element with a
       silent WAV on the first pointer/key event and immediately pause it. The
       unlock sticks for the life of the element — later play() calls from
       non-gesture contexts then succeed. Without this, every page refresh
       re-arms the policy and "play music" fails until a manual tap. */
    let playerUnlocked = false;
    function unlockPlayer() {
      if (playerUnlocked) return;
      playerUnlocked = true;
      try {
        if (actx && actx.state === "suspended") actx.resume().catch(() => { });
        ensureMusicCtx();                   // create + start it inside the gesture
        if (!player.src) player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";

        if (p && p.then) p.then(() => { try { player.pause(); } catch (e) { } }, () => { });
      } catch (e) { }

    document.addEventListener("keydown", unlockPlayer);

    function fmtT(s) {

      return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    }
    function mUI() {
      const playing = !player.paused && mLoaded;
      pEl.classList.toggle("playing", playing);
      pEl.classList.toggle("paused", !playing && mStarted);

      pPlay.setAttribute("title", playing ? "pause" : "play");
    }
    function mRenderTrack(anim) {
      const t = mTracks[mIdx]; if (!t) return;
      pTitle.textContent = t.title;
      pArtist.textContent = t.artist ? (t.artist + (t.album ? " · " + t.album : "")) : (t.album || "local track");
      pDur.textContent = t.duration ? fmtT(t.duration) : "—";
      pFill.style.width = "0%"; pCur.textContent = "0:00";

        pTitle.style.animation = "none"; void pTitle.offsetWidth; pTitle.style.animation = "";
        pArtist.style.animation = "none"; void pArtist.offsetWidth; pArtist.style.animation = "";

    function mShowCard() { pEl.classList.add("show"); }
    function mHideCard() { pEl.classList.remove("show"); }
    async function mEnsureTracks() {
      if (mTracks.length) return mTracks;
      try {
        const r = await fetch("music", { signal: AbortSignal.timeout(6000) });
        if (!r.ok) throw new Error("music " + r.status);
        mTracks = (await r.json()).tracks || [];

    function mWireMusicGraph() {

      // the song. Done once; MediaElementSource can only be created once per
      // element, and from then on the element is silent unless the context
      // runs — so only wire it once the context is actually running (it
      // starts on the first tap); until then the element plays directly.

        case "STOP":

          break;

    /* =====================================================================
       MIC CAPTURE  — AudioWorklet (fallback: ScriptProcessor)
       ===================================================================== */
    function pushSample(x) {
      const s = Math.max(-1, Math.min(1, x));
      pcmOut[pcmFill++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (pcmFill === CHUNK) {
        pcmFill = 0;
        if (ws && ws.readyState === 1) ws.send(pcmOut);   // send() copies the bytes
      }
    }
    // Mic blocks (128 samples from the worklet) -> 16 kHz int16 chunks of CHUNK.
    // Most browsers honour the 16 kHz AudioContext; when one doesn't, resample
    // with linear interpolation whose phase carries across blocks (resampling
    // each block on its own would put a click at every block boundary).
    function onMicBlock(input, inRate) {
      if (inRate === SR) { for (let i = 0; i < input.length; i++) pushSample(input[i]); return; }
      const step = inRate / SR;
      // rsPos indexes [rsPrev, ...input]: 0 = last sample of the previous block
      for (; rsPos < input.length; rsPos += step) {
        const i0 = rsPos | 0, f = rsPos - i0;
        const a = i0 === 0 ? rsPrev : input[i0 - 1], b = input[i0];
        pushSample(a + (b - a) * f);
      }
      rsPos -= input.length;
      rsPrev = input[input.length - 1];
    }

    // Turn getUserMedia / setup failures into something the user can act on.
    function micErrorMessage(err) {

      switch (err && err.name) {
        case "NotAllowedError": case "SecurityError":
          return "microphone permission was blocked — allow it in the address bar, then tap to retry";
        case "NotFoundError": case "OverconstrainedError":
          return "no microphone found — plug one in, then tap to retry";
        case "NotReadableError": case "AbortError":
          return "the microphone is busy in another app — close it, then tap to retry";
      }
      return "microphone unavailable: " + ((err && err.message) || err);
    }

    async function startMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("insecure context");
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1
        }
      });
      actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
      if (actx.state === "suspended") await actx.resume();
      const src = actx.createMediaStreamSource(stream);

      analyser = actx.createAnalyser();
      analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.55;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);   // waveform only — NOT routed to speakers (no feedback)

      if (actx.audioWorklet) {
        const code = `class MicCap extends AudioWorkletProcessor{
      process(inp){ const ch=inp[0]&&inp[0][0]; if(ch) this.port.postMessage(ch.slice(0)); return true; }
    } registerProcessor('miccap',MicCap);`;
        const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
        await actx.audioWorklet.addModule(url);
        const node = new AudioWorkletNode(actx, "miccap");
        src.connect(node);
        node.port.onmessage = e => onMicBlock(e.data, actx.sampleRate);
      } else {
        const sp = actx.createScriptProcessor(2048, 1, 1);
        const mute = actx.createGain(); mute.gain.value = 0;
        src.connect(sp); sp.connect(mute); mute.connect(actx.destination);
        sp.onaudioprocess = e => onMicBlock(e.inputBuffer.getChannelData(0), actx.sampleRate);
      }
    }

    /* =====================================================================
       SPEECH — replies are spoken as well as shown. server.py synthesizes
       them on-device (GET /tts -> WAV: piper / espeak-ng / macOS say); when
       it has no engine ("ready".tts === "browser", or the demo has no
       server) the browser's own speechSynthesis voice is used instead.
       "off" (server.py --tts off) or ?mute keeps it silent. Music is ducked
       while speaking, and a new wake word cuts the reply off so it isn't
       recorded as part of the next command.
       ===================================================================== */
    let ttsMode = new URLSearchParams(location.search).has("mute") ? "off"
      : DEMO ? "browser" : "server";
    const voice = new Audio();
    let speakSeq = 0;
    function speakable(s) {
      const div = document.createElement("div");
      div.innerHTML = s;                                    // drop tags, decode &amp; etc.
      return div.textContent
        .replace(/°C/g, " degrees Celsius").replace(/°/g, " degrees")
        .replace(/\s*—\s*/g, ", ").replace(/…/g, ".")
        .replace(/\b(\d+) (h|min)\b/g, (_, n, u) =>             // fmtIn: "1 h 5 min"
          `${n} ${u === "h" ? "hour" : "minute"}${n === "1" ? "" : "s"}`)
        .replace(/\s+/g, " ").trim();
    }
    function stopSpeaking() {
      speakSeq++;
      voice.pause(); voice.removeAttribute("src");
      if (window.speechSynthesis) speechSynthesis.cancel();
    }
    function speechDone(seq) {
      if (seq !== speakSeq) return;                         // superseded by newer speech
      const busy = state === "awake" || state === "listening"
        || (alarmActive && alarmPhase === "ringing");       // those own the duck
      if (!busy) mDuck(false);
    }
    function speakBrowser(text, seq) {
      if (!window.speechSynthesis || seq !== speakSeq) return speechDone(seq);
      const u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = () => speechDone(seq);
      speechSynthesis.speak(u);
    }
    function speak(text) {
      text = speakable(text || "");
      if (!text || ttsMode === "off") return;
      stopSpeaking();
      const seq = speakSeq;
      mDuck(true);
      if (ttsMode === "browser") return speakBrowser(text, seq);
      voice.src = "tts?text=" + encodeURIComponent(text);
      voice.onended = () => speechDone(seq);
      voice.onerror = () => speakBrowser(text, seq);          // server engine failed
      voice.play().catch(() => speakBrowser(text, seq));
    }

    /* =====================================================================
       WEBSOCKET  — talk to server.py
       ===================================================================== */
    // Reconnects with backoff (1 s -> 10 s), so restarting server.py on the Pi
    // doesn't need a page reload.
    let wsRetryMs = 1000, wsRetryTimer = null, wsWasUp = false;
    function connectWS() {
      clearTimeout(wsRetryTimer);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        liveEl.classList.add("show", "on"); liveTxt.textContent = "live";
        ws.send(String(SR));                 // tell server the rate of incoming PCM
        setLive(true);
        if (wsWasUp) toast("reconnected", 1400);
        wsWasUp = true; wsRetryMs = 1000;
      };
      ws.onmessage = ev => {
        if (typeof ev.data !== "string") return;
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        switch (m.type) {
          case "ready":
            toast(`ready · ${m.models.join(", ")}`, 1200);
            if (ttsMode !== "off" && m.tts) ttsMode = m.tts === "browser" || m.tts === "off" ? m.tts : "server";
            break;
          case "awake": onAwake(m); break;
          case "result": lastLatency = m.latency_ms || 0; onResult(m); break;
          case "rejected": onRejected(m.message); break;
          case "idle": mDuck(false); if (state !== "idle" && !timerActive) backToIdle(); break;
          case "error": toast(m.message, 2600); break;
        }
      };
      ws.onclose = () => {
        setLive(false);
        if (state === "awake" || state === "listening") backToIdle();   // command was cut off
        if (wsRetryMs === 1000) toast("server disconnected — is server.py running? retrying…", 4000);
        wsRetryTimer = setTimeout(connectWS, wsRetryMs);
        wsRetryMs = Math.min(wsRetryMs * 2, 10000);
      };
    }
    function backToIdle() {
      mDuck(false);
      state = "idle"; phraseEl.classList.remove("show");
      detailEl.classList.remove("show"); document.body.classList.remove("busy");
      hintEl.textContent = "say “hey alexa” to begin";
    }
    function setLive(on) { liveEl.classList.toggle("on", on); liveTxt.textContent = on ? "live" : "off"; }

    /* =====================================================================
       BOOT
       ===================================================================== */
    /* ---- bottom dock: player, start pill, reminders panel and toast all
       live at bottom-center. Stack whichever are showing (bottom -> top)
       instead of letting them overlap; re-run whenever one shows, hides or
       changes size. Hidden ones park where they would appear. ---- */
    const DOCK = [
      { el: pEl, on: () => pEl.classList.contains("show") },
      { el: startBtn, on: () => !startBtn.classList.contains("hidden") },
      { el: remPanel, on: () => remPanel.classList.contains("show") },
      { el: toastEl, on: () => toastEl.classList.contains("show") },
    ];
    const DOCK_GAP = 12;
    DOCK.forEach(d => { d.base = parseFloat(getComputedStyle(d.el).bottom) || 20; });
    function layoutDock() {
      let y = 0;
      for (const d of DOCK) {
        const bottom = Math.max(d.base, y);
        d.el.style.bottom = bottom + "px";
        if (d.on()) y = bottom + d.el.offsetHeight + DOCK_GAP;
      }
    }
    {
      const mo = new MutationObserver(layoutDock), ro = new ResizeObserver(layoutDock);
      DOCK.forEach(d => { mo.observe(d.el, { attributes: true, attributeFilter: ["class"] }); ro.observe(d.el); });
      addEventListener("resize", layoutDock);
      layoutDock();
    }

    function toast(msg, ms = 2000) {
      toastEl.textContent = msg; toastEl.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove("show"), ms);
    }

    async function begin() {
      startBtn.classList.add("hidden");
      if (DEMO) {
        // no mic / no server — simulate the conversation to preview the design
        liveEl.classList.add("show", "on"); liveTxt.textContent = "demo";
        setLive(true);
        demoLoop();
        return;
      }
      if (location.protocol === "file:") {
        // opened straight from disk: there's no server to stream audio to
        toast("start the server (python3 src/server.py) and open http://localhost:8321 — or add ?demo to preview", 6000);
        startBtn.classList.remove("hidden");
        return;
      }
      try {
        startTxt.textContent = "starting…";
        await startMic();
      } catch (err) {
        toast(micErrorMessage(err), 6000);
        startBtn.classList.remove("hidden"); startTxt.textContent = "tap to retry";
        return;
      }
      connectWS();
      hintEl.textContent = "say “hey alexa” to begin";
    }

    function demoLoop() {
      // scripted: idle -> wake -> listening -> result -> idle ...
      const cmds = [
        { intent: "ALARM", slot: "6 AM" },
        { intent: "LIGHT_ON", slot: "NO_SLOT" },
        { intent: "BRIGHTNESS", slot: "60 percent" },
        { intent: "BRIGHTNESS", slot: "20 percent" },
        { intent: "LIGHT_OFF", slot: "NO_SLOT" },
        { intent: "PLAY_MUSIC", slot: "NO_SLOT" },
        { intent: "PAUSE", slot: "NO_SLOT" },
        { intent: "NEXT", slot: "NO_SLOT" },
        { intent: "STOP", slot: "NO_SLOT" },
        { intent: "TIMER", slot: "1 minute" },
        { intent: "COLOR", slot: "blue" },
        { intent: "VOLUME_UP", slot: "NO_SLOT" },
        { intent: "TEMPERATURE", slot: "18 degrees" },
        { intent: "TEMPERATURE", slot: "26 degrees" },
        { intent: "TEMPERATURE", slot: "22 degrees" },
        { intent: "CALL", slot: "NO_SLOT" },
        { intent: "MESSAGE", slot: "NO_SLOT" },
        { intent: "WEATHER", slot: "NO_SLOT" },
        { intent: "CREATE_REMINDER", slot: "drink water" },
        { intent: "LIST_REMINDERS", slot: "NO_SLOT" }
      ];
      let i = 0;
      function step() {
        if (document.hidden) { setTimeout(step, 1500); return; }
        onAwake();
        setTimeout(() => { state = "listening"; }, 900);
        setTimeout(() => {
          const c = cmds[i % cmds.length]; i++;
          onResult({ ...c, latency_ms: 8 + Math.random() * 20 });
        }, 3400);
        setTimeout(step, 7200);
      }
      setTimeout(step, 1200);
    }

    startBtn.addEventListener("click", begin);
    // allow tapping the whole screen to start (mobile friendly)
    document.querySelector(".stage").addEventListener("click", () => {
      if (state === "idle" && !startBtn.classList.contains("hidden")) begin();
    });
    fetchWeather();          // populate the weather chip (GPS prompt if allowed, else IP)
    resize();
  </script>
</body>

</html>
